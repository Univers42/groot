    expose:
      - "3002"
    depends_on:
      mail-bridge:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://127.0.0.1:3002'').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"',
        ]
      interval: 30s
      start_interval: 2s
      timeout: 3s
      start_period: 30s
      retries: 20
    restart: unless-stopped
    mem_limit: 1g

  calendar-bridge:
    image: ${CALENDAR_BRIDGE_IMAGE:-track-binocle/calendar-bridge:local}
    profiles:
      - dev
    build:
      context: ./apps/calendar
      target: dev
    working_dir: /app
    command: ["npm", "run", "bridge"]
    env_file:
      - path: ./apps/calendar/.env
        required: false
      - path: ./apps/mail/.env
        required: false
      - path: ./.env.local
        required: false
      - path: ./apps/calendar/.env.local
        required: false
      # secrets injected at up-time from ./.env.local
    environment:
      NODE_ENV: development
      CALENDAR_BRIDGE_PORT: ${CALENDAR_BRIDGE_PORT:-4200}
      CALENDAR_APP_ORIGIN: https://localhost:${CALENDAR_HOST_PORT:-3003}
      CALENDAR_BRIDGE_PUBLIC_ORIGIN: https://localhost:${CALENDAR_BRIDGE_PORT:-4200}
      CALENDAR_REDIRECT_URI: https://localhost:${CALENDAR_BRIDGE_PORT:-4200}/auth/google/callback
      CALENDAR_BAAS_URL: http://mini-baas-kong:8000
      CALENDAR_BAAS_PUBLIC_URL: https://localhost:${KONG_HTTP_PORT:-8000}
      VAULT_ADDR: ${CALENDAR_BRIDGE_VAULT_ADDR:-http://vault:8200}
    volumes:
      - ./apps/calendar:/app
      - calendar-node-modules:/app/node_modules
    expose:
      - "4200"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - mini-baas
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "const port=process.env.CALENDAR_BRIDGE_PORT||4200; fetch(''http://127.0.0.1:''+port+''/health'').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"',
        ]
      interval: 30s
      start_interval: 2s
      timeout: 3s
      start_period: 20s
      retries: 12
    restart: unless-stopped
    mem_limit: 512m

  calendar:
    image: ${CALENDAR_IMAGE:-track-binocle/calendar:local}
    profiles:
      - dev
    build:
      context: ./apps/calendar
      target: dev
    working_dir: /app
    command: ["npm", "run", "dev"]
    env_file:
      - path: ./apps/calendar/.env
        required: false
      - path: ./apps/calendar/.env.local
        required: false
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"
      VITE_CALENDAR_BRIDGE_URL: https://localhost:${CALENDAR_BRIDGE_PORT:-4200}
      VITE_CALENDAR_BAAS_URL: https://localhost:${KONG_HTTP_PORT:-8000}
    volumes:
      - ./apps/calendar:/app
      - calendar-node-modules:/app/node_modules
    expose:
      - "3003"
    depends_on:
      calendar-bridge:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://127.0.0.1:3003'').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"',
        ]
      interval: 30s
      start_interval: 2s
      timeout: 3s
      start_period: 30s
      retries: 20
    restart: unless-stopped
    mem_limit: 1g

  # prismatica-auth-gateway — the custom API gateway / auth BFF, as its own
  # self-contained image, built from the pinned apps/opposite-osiris submodule
  # (published as dlesieur/prismatica-auth-gateway). The context is the repo root
  # because the Dockerfile COPYs apps/opposite-osiris/...; its per-Dockerfile
  # .dockerignore allowlists the few files it needs.
  # Server-only secrets (SERVICE_ROLE_KEY, OSIONOS_BRIDGE_SHARED_SECRET,
  # TURNSTILE_SECRET_KEY) are injected at RUNTIME via env_file below.
  auth-gateway:
    image: ${AUTH_GATEWAY_IMAGE:-track-binocle/prismatica-auth-gateway:local}
    build:
      context: .
      dockerfile: apps/opposite-osiris/docker/services/api-gateway/Dockerfile
    profiles:
      - dev
      - local
    env_file:
      - path: ./.env.local
        required: false
      # secrets injected at up-time from ./.env.local
    environment:
      AUTH_GATEWAY_PORT: 8787
      PUBLIC_BAAS_URL: http://mini-baas-kong:8000
      OSIONOS_BRIDGE_URL: http://osionos-bridge:4000/api/auth/bridge/session
      PUBLIC_SITE_URL: https://localhost:${OPPOSITE_OSIRIS_HOST_PORT:-4322}
      # Stays false locally until the confirm page ships (verdict B C13): turning it on
      # before /auth/confirm exists would mail links to a page that cannot spend them.
      AUTH_REQUIRE_EMAIL_VERIFICATION: ${AUTH_REQUIRE_EMAIL_VERIFICATION:-false}
      PUBLIC_AUTH_REQUIRE_EMAIL_VERIFICATION: ${PUBLIC_AUTH_REQUIRE_EMAIL_VERIFICATION:-false}
      # Turnstile config used to live in opposite-osiris/.env.local (now removed).
      # Behavior flag defaults to bypass for local (prod sets it false). The
      # SECRET itself is NOT set here on purpose — `environment:` overrides
      # `env_file:`, so an empty default would clobber the Vault-fetched value.
      # TURNSTILE_SECRET_KEY is injected at up-time from ./.env.local.
      TURNSTILE_BYPASS_LOCAL: ${TURNSTILE_BYPASS_LOCAL:-true}
      # The gateway holds no SMTP config (ADR 0006): every mail goes to grobase
      # POST ${PUBLIC_BAAS_URL}/email/v1/send with SERVICE_ROLE_KEY (from ./.env.local).
      # tests/e2e/run.sh refuses the pr*/dm* specs unless grobase's senders deliver to Mailpit.
      # Test domains exempt from the MX check; the only source of that list.
      AUTH_EMAIL_DOMAIN_ALLOWLIST: ${AUTH_EMAIL_DOMAIN_ALLOWLIST:-example.test,mini-baas.local,localhost}
      # Second factor: a 6-digit sign-in code mailed after the password. Needs grobase EMAIL_OTP_ENABLED.
      AUTH_LOGIN_EMAIL_OTP: ${AUTH_LOGIN_EMAIL_OTP:-false}
      # Signed confirm/reset links (C1). AUTH_LINK_SIGNING_KEY is NOT set here: like
      # TURNSTILE_SECRET_KEY, an empty default would clobber the value scripts/gen-local-env.sh
      # mints into ./.env.local (env_file above). Without it the link routes answer 503.
      AUTH_VERIFY_TOKEN_TTL_SEC: ${AUTH_VERIFY_TOKEN_TTL_SEC:-86400}
      AUTH_RESET_TOKEN_TTL_SEC: ${AUTH_RESET_TOKEN_TTL_SEC:-3600}
      # --- security hardening (prismatica auth-gateway) ---
      # Real browser traffic reaches the gateway through 2 appending reverse
      # proxies: local-https-proxy(4322) -> opposite-osiris-web(8080) -> gateway.
      # Deriving the client IP from that trusted hop count means a spoofed
      # X-Forwarded-For cannot mint fresh rate-limit buckets (HIGH-1).
      AUTH_TRUSTED_PROXY_HOPS: ${AUTH_TRUSTED_PROXY_HOPS:-2}
      # Shared, restart-surviving rate-limit / lockout / anti-replay state.
      # Falls back to a bounded in-memory store if Redis is unreachable.
      REDIS_URL: ${AUTH_GATEWAY_REDIS_URL:-redis://mini-baas-redis:6379}
      # osionos origin used to validate the bridge redirect target (LOW-3).
      PUBLIC_OSIONOS_APP_URL: ${PUBLIC_OSIONOS_APP_URL:-https://localhost:3001}
    expose:
      - "8787"
    networks:
      - default
      - mini-baas
    depends_on:
      osionos-bridge:
        condition: service_healthy
    # prismatica 6984374 (main, what `make all` syncs to) serves /api/auth/health and 404s the old
    # /api/auth/availability; the pin 8559d6d and older published images serve only the old one.
    # Fresh-Machine runs 39091236637..39140018952 died here on main's 404.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://127.0.0.1:8787/api/auth/health'').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"',
        ]
      interval: 30s
      start_interval: 2s
      timeout: 3s
      start_period: 20s
      retries: 12
    restart: unless-stopped
    mem_limit: 256m

  # opposite-osiris WEBSITE — served as a STANDALONE image, built from the pinned
  # apps/opposite-osiris submodule (published as dlesieur/opposite-osiris-web):
  # nginx serves the static `astro build` output AND reverse-proxies /api/* to the
  # BaaS, mirroring the old Vite dev-proxy routing. Fronted by local-https-proxy
  # at :4322. Repo-root context, narrowed by the per-Dockerfile .dockerignore.
  opposite-osiris-web:
    profiles:
      - dev
    image: ${OPPOSITE_OSIRIS_WEB_IMAGE:-track-binocle/opposite-osiris-web:local}
    build:
      context: .
      dockerfile: apps/opposite-osiris/docker/services/web/Dockerfile
      # PUBLIC_* are inlined into the browser bundle. The anon key is this machine's
      # grobase key from ./.env.local (public by design); the published image bakes
      # whichever key its builder had.
      args:
        PUBLIC_BAAS_ANON_KEY: ${ANON_KEY:-}
        PUBLIC_SITE_URL: https://localhost:${OPPOSITE_OSIRIS_HOST_PORT:-4322}
        PUBLIC_OSIONOS_APP_URL: ${PUBLIC_OSIONOS_APP_URL:-https://localhost:3001}
    environment:
      # Runtime, env-driven BaaS upstreams. Default to the local stack's service
      # DNS; override (e.g. OO_BAAS_UPSTREAM=https://baas.example.com) for prod.
      OO_AUTH_UPSTREAM: ${OO_AUTH_UPSTREAM:-http://auth-gateway:8787}
      OO_BAAS_UPSTREAM: ${OO_BAAS_UPSTREAM:-http://mini-baas-kong:8000}
      OO_RESOLVER: ${OO_RESOLVER:-127.0.0.11}
    expose:
      - "8080"
    # Optional direct (plain-HTTP) access for debugging, bypassing the TLS proxy.
    ports:
      - "${TRACK_BINOCLE_BIND_ADDR:-127.0.0.1}:${OPPOSITE_OSIRIS_WEB_HOST_PORT:-4323}:8080"
    networks:
      - default
      - mini-baas
    depends_on:
      auth-gateway:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:8080/ >/dev/null 2>&1 || exit 1",
        ]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 5
    restart: unless-stopped
    mem_limit: 128m

  playground-simulation:
    profiles:
      - testing
    image: ${PLAYGROUND_SIMULATION_IMAGE:-track-binocle/playground-simulation:local}
    build:
      context: ./apps/osionos/app
      dockerfile: docker/services/browser-tests/Dockerfile
    working_dir: /app
    init: true
    ipc: host
    network_mode: host
    environment:
      CI: "1"
      NODE_ENV: test
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      PLAYGROUND_WEBSITE_URL: https://127.0.0.1:4322
      PLAYGROUND_APP_URL: https://127.0.0.1:3001
      PLAYGROUND_BRIDGE_URL: https://127.0.0.1:4000
      PLAYGROUND_MAIL_URL: https://127.0.0.1:3002
      PLAYGROUND_MAIL_BRIDGE_URL: https://127.0.0.1:4100
      PLAYGROUND_CALENDAR_URL: https://127.0.0.1:3003
      PLAYGROUND_CALENDAR_BRIDGE_URL: https://127.0.0.1:4200
      NODE_EXTRA_CA_CERTS: /certs/track-binocle-local-ca.pem
      PLAYGROUND_VIEWER_DIR: /app/public/playground-simulation
      PLAYGROUND_HEADLESS: ${PLAYGROUND_HEADLESS:-1}
      PLAYGROUND_SLOWMO_MS: ${PLAYGROUND_SLOWMO_MS:-80}
    volumes:
      - ./apps/osionos/app:/app
      - ./apps/grobase/certs:/certs:ro
      - osionos-browser-test-node-modules:/app/node_modules
      - osionos-browser-test-pnpm-store:/pnpm/store
    entrypoint:
      ["/bin/bash", "/app/docker/services/browser-tests/entrypoint.sh"]
    command: ["node", "scripts/playground-simulation.mjs"]

  # agency-simulation — the Binocle Intelligence Agency end-to-end Playwright
  # run (make agency-sim): multi-context org simulation (owner + employees)
  # over the REAL stack. Same image/harness as playground-simulation; host
  # networking reaches the website (4322), app (3001), bridge (4000), root
  # Kong (8000), mini-baas Kong (8002), Mailpit (8025) and LiveKit (7880).
  # env_file supplies SERVICE_ROLE_KEY for the gotrue invite leg.
  agency-simulation:
    profiles:
      - testing
    image: ${PLAYGROUND_SIMULATION_IMAGE:-track-binocle/playground-simulation:local}
    build:
      context: ./apps/osionos/app
      dockerfile: docker/services/browser-tests/Dockerfile
    working_dir: /app
    init: true
    ipc: host
    network_mode: host
    env_file:
      - path: ./.env.local
        required: false
      # secrets injected at up-time from ./.env.local
    environment:
      CI: "1"
      NODE_ENV: test
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      AGENCY_WEBSITE_URL: https://127.0.0.1:4322
      AGENCY_APP_URL: https://127.0.0.1:3001
      AGENCY_BRIDGE_URL: https://127.0.0.1:4000
      # 8444 = the proxy's TLS edge for Kong. Host 8000 is Kong's own plain-HTTP
      # listener, so an https:// URL against it could never connect.
      AGENCY_KONG_URL: https://127.0.0.1:8444
      AGENCY_MAILPIT_URL: http://127.0.0.1:8025
      AGENCY_LIVEKIT_HTTP_URL: http://127.0.0.1:7880
      AGENCY_ARTIFACTS_DIR: /app/test-results/agency-simulation
      AGENCY_PEOPLE_ENV: /seeds/.agency-people.env
      AGENCY_TENANT_ENV: /seeds/.agency-tenant.env
      AGENCY_HEADLESS: ${AGENCY_HEADLESS:-1}
      AGENCY_SLOWMO_MS: ${AGENCY_SLOWMO_MS:-40}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-devsecret-livekit-local-0123456789abcdef}
      NODE_EXTRA_CA_CERTS: /certs/track-binocle-local-ca.pem
    volumes:
      - ./apps/osionos/app:/app
      - ./apps/grobase/certs:/certs:ro
      - ./tools/seeds/.agency-people.env:/seeds/.agency-people.env:ro
      - osionos-browser-test-node-modules:/app/node_modules
      - osionos-browser-test-pnpm-store:/pnpm/store
    entrypoint:
      ["/bin/bash", "/app/docker/services/browser-tests/entrypoint.sh"]
    command: ["node", "scripts/agency-simulation.mjs"]

  # Grobase marketing-site quality gate — backs `make grobase-audit` and
  # `make grobase-e2e`. Builds the website's `audit` Dockerfile stage (system
  # Chromium + Lighthouse + pa11y) and runs the self-contained gate (astro build →
  # HTTP preview on :4325 → html-validate + CSP check + pa11y WCAG2AA + Lighthouse
  # >=90 ×4). Self-contained: no published ports, no backend network needed.
  grobase-site-audit:
    profiles:
      - grobase
    build:
      context: ./apps/grobase/vendor/grobase-website
      dockerfile: Dockerfile
      target: audit
    image: track-binocle/grobase-site-audit:local

  # ── IDE sandbox plane (profile `ide`; NEVER started by `make all`) ──────────
  # The isolated sandbox daemon is NOT a compose service — it is a host systemd
  # unit `docker-ide.service` (a second rootful dockerd, own data-root/socket,
  # --userns-remap, --iptables=false) so a sandbox/provisioner compromise can
  # never see the mini-baas backend on the main daemon (devil condition 1). See
  # the runbook infrastructure/docker/osionos/ide-sandbox/README.md "Activation".
  #
  # The filtering docker-socket proxy — the ONLY path from the provisioner to the
  # docker-ide daemon (condition 2). It bind-mounts the host /run/docker-ide.sock
  # and exposes a filtered TCP endpoint that allowlists endpoints AND vets the
  # create body (condition 8). Reachable only by osionos-ide-server on the control
  # net (C17 moved the provisioner there).
  osionos-ide-socket-proxy:
    build:
      context: infrastructure/docker/osionos/ide-socket-proxy
    image: ${OSIONOS_IDE_SOCKET_PROXY_IMAGE:-osionos-ide-socket-proxy:latest}
    container_name: track-binocle-osionos-ide-socket-proxy
    profiles: ["ide"]
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # The image runs as `node`; the socket is 0660 root:<docker gid of the HOST>, so the proxy
    # joins that numeric gid (deploy-plane.sh reads it with `stat -c %g` on the socket). Unset,
    # 0 grants nothing: every call answers 502 "daemon unreachable" (measured on the VM).
    group_add:
      - "${OSIONOS_IDE_DOCKER_GID:-0}"
    # Ponytail: one Node process relaying streams fits in 64m and 64 pids; a burst
    # of many concurrent PTY attaches needs more — raise both together.
    mem_limit: 64m
    pids_limit: 64
    environment:
      IDE_DOCKER_SOCK: /dind-run/docker.sock
      # The create-body vetting allows exactly this image; it must be the one osionos-ide-server
      # asks for, so both interpolate the same variable (a pinned sha256 id from ship-images.sh).
      OSIONOS_IDE_SANDBOX_IMAGE: ${OSIONOS_IDE_SANDBOX_IMAGE:-osionos-ide-sandbox:latest}
      # K11: with a runtime named here (e.g. runsc) the proxy writes it into every create and refuses
      # a start under another. Empty (the default) leaves the plane as before.
      OSIONOS_IDE_REQUIRE_RUNTIME: ${OSIONOS_IDE_REQUIRE_RUNTIME:-}
    volumes:
      # Host bind of the isolated daemon's socket (docker-ide.socket owns the file,
      # so a daemon restart keeps the inode this mount holds). Long syntax so the
      # start fails when the socket is absent: a missing host path must never
      # become a directory docker-ide can no longer bind (README, step A).
      - type: bind
        source: ${OSIONOS_IDE_DOCKER_SOCK:-/run/docker-ide.sock}
        target: /dind-run/docker.sock
        bind:
          create_host_path: false
      # The owner<->uid ledger (ADR 0011). A named volume so it survives a container recreate; `compose down`
      # without -v keeps it, and losing it re-learns bindings by trust on first use.
      - osionos-ide-ledger:/ledger
    expose:
      - "2375"
    networks:
      - osionos-ide-control-net

  # osionos-ide-server — the IDE sandbox control plane (P2–P7). Serves every
  # sandbox route (/api/ide/session|fs|git|search|ports|preview/session), the
  # /api/ide/pty|lsp|fsync upgrades, and the preview at /p/<cap>/…. Accepts
  # only the 15-minute, one-workspace IDE token minted by the bridge
  # (POST /api/ide/token). Runs from the bridge image (no second build) with
  # a different entrypoint. The secret arrives via Compose interpolation from
  # the project .env / shell; `make` passes --env-file ./.env.local, so the
  # IDE server never uses env_file and the bridge's .env.local (which holds DB
  # credentials) is not read here.
  osionos-ide-server:
    image: ${OSIONOS_BRIDGE_IMAGE:-track-binocle/osionos-bridge:local}
    profiles: ["ide"]
    restart: unless-stopped
    command: ["node", "scripts/ide-server.mjs"]
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 384m
    pids_limit: 256
    environment:
      NODE_ENV: production
      OSIONOS_IDE_SERVER_PORT: 4100
      OSIONOS_IDE_TOKEN_SECRET: ${OSIONOS_IDE_TOKEN_SECRET:-}
      OSIONOS_IDE_ALLOWED_ORIGIN: ${OSIONOS_IDE_ALLOWED_ORIGIN:-https://localhost:3001}
      OSIONOS_IDE_PUBLIC_URL: ${OSIONOS_IDE_PUBLIC_URL:-https://localhost:8446}
      OSIONOS_IDE_SANDBOX: ${OSIONOS_IDE_SANDBOX:-}
      OSIONOS_IDE_DOCKER_HOST: ${OSIONOS_IDE_DOCKER_HOST:-}
      OSIONOS_IDE_ALLOWED_SUBJECTS: ${OSIONOS_IDE_ALLOWED_SUBJECTS:-}
      OSIONOS_IDE_ACCESS: ${OSIONOS_IDE_ACCESS:-}
      OSIONOS_IDE_DENIED_SUBJECTS: ${OSIONOS_IDE_DENIED_SUBJECTS:-}
      OSIONOS_IDE_SANDBOX_IMAGE: ${OSIONOS_IDE_SANDBOX_IMAGE:-osionos-ide-sandbox:latest}
      OSIONOS_IDE_STORAGE_QUOTA: ${OSIONOS_IDE_STORAGE_QUOTA:-}
      # Boxes running at once (bridge-ide-sandbox.mjs maxRunningBoxes, default 2): size it with
      # osionos-ide.slice MemoryMax at 1 GiB a box.
      OSIONOS_IDE_MAX_BOXES: ${OSIONOS_IDE_MAX_BOXES:-}
      # Box-create limits per hour (defaults 6 per user, 30 global) and the volume size quota
      # (off until the user has run B3.2 on docker-ide).
      OSIONOS_IDE_CREATES_PER_USER_HOUR: ${OSIONOS_IDE_CREATES_PER_USER_HOUR:-}
      OSIONOS_IDE_CREATES_GLOBAL_HOUR: ${OSIONOS_IDE_CREATES_GLOBAL_HOUR:-}
      OSIONOS_IDE_VOLUME_QUOTA: ${OSIONOS_IDE_VOLUME_QUOTA:-}
    expose:
      - "4100"
    networks:
      - osionos-ide-control-net
      - osionos-ide-edge-net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://127.0.0.1:4100/healthz'').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"',
        ]
      interval: 30s
      start_interval: 2s
      timeout: 3s
      start_period: 10s
      retries: 6
    depends_on:
      osionos-ide-socket-proxy:
        condition: service_started

  # ---------------------------------------------------------------------------
  # drawnosaurus — opt-in collaborative whiteboard (apps/drawnosaurus, pinned).
  #
  # Explicit services rather than `include:` of the submodule's own compose: that file
  # publishes host ports on every service, two of them on 0.0.0.0 (its `realtime` and the
  # gateway's SHARE_PORT). Including it would leak them. Here nothing publishes a port —
  # the ONLY way in is local-https-proxy:3007, on 127.0.0.1.
  #
  # Isolation (three layers, all groot-side; the submodule is unmodified):
  #  1. `drawnosaurus-internal` is `internal: true` — no egress, and unreachable from the
  #     other track-binocle containers. The GATEWAY DOES NOT JOIN THE DEFAULT NETWORK:
  #     local-https-proxy joins the internal net instead (same shape as osionos-runner-net
  #     below). Dual-homing the gateway would let any of the ~27 containers reach the API
  #     with Caddy's `host` role stamped on it — including DELETE.
  #  2. nginx :3007 refuses /v1/share* entirely and DELETE /v1/boards/*.
  #  3. SHARE_TUNNEL_TARGET is deliberately ABSENT: apps/api/src/config.ts:96 then yields
  #     tunnelTarget=null, and tunnel.ts:113 returns before spawning the cloudflared binary
  #     that api.Dockerfile:27 bakes into the image. Do not add it back.
  #
  # KNOWN, ACCEPTED (Phase 1): anyone who can reach 127.0.0.1:3007 can list, create and
  # EDIT every board — PUT /v1/boards/:slug is a full replace, so "DELETE is blocked" does
  # not mean data cannot be lost. There is no per-user identity; X-Owner-Id is pinned empty
  # at the proxy because apps/api/src/auth.ts:22-31 otherwise lets a caller pick any owner.
  drawnosaurus-mongo:
    image: mongo:7
    command: ["--bind_ip_all", "--quiet"]
    volumes:
      - drawnosaurus-mongo-data:/data/db
    expose:
      - "27017"
    networks:
      - drawnosaurus-internal
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 30s
      start_period: 10s
      start_interval: 2s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    mem_limit: 512m

  drawnosaurus-api:
    build:
      context: ./apps/drawnosaurus
      dockerfile: docker/api.Dockerfile
    environment:
      MONGO_URL: mongodb://drawnosaurus-mongo:27017
      MONGO_DB: drawnosaurus
      PORT: "4000"
      # Not "*" (the upstream default at config.ts:91). This is the only thing refusing a
      # cross-origin write from a page the user happens to have open.
      CORS_ORIGIN: https://localhost:${OSIONOS_APP_HOST_PORT:-3001}
      AUTH_MODE: dev
      # SHARE_TUNNEL_TARGET intentionally omitted — see the header. Layer 3.
    depends_on:
      drawnosaurus-mongo:
        condition: service_healthy
    expose:
      - "4000"
    networks:
      drawnosaurus-internal:
        # The gateway's Caddyfile is mounted read-only from the submodule and hardcodes
        # `api:4000` / `realtime:4000` / `web:3000` — upstream's own service names. Renaming
        # them here would mean editing drawnosaurus, so the containers answer to both names
        # instead. Without this the gateway 502s on "lookup api ... server misbehaving".
        aliases: [api]
    # $$PORT is the container's own PORT above (escaped so compose does not interpolate it): the probe follows PORT if it changes.
    # Ponytail: 3 s per probe (auth-gateway's value): a Node start slower than that on a loaded
    # host counts as unhealthy until a probe within the 12 retries makes it.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://127.0.0.1:$$PORT/healthz'').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"',
        ]
      interval: 30s
      start_interval: 2s
      timeout: 3s
      start_period: 20s
      retries: 12
    restart: unless-stopped
    mem_limit: 512m

  drawnosaurus-realtime:
    build:
      context: ./apps/drawnosaurus/engine/realtime
      dockerfile: ../../docker/realtime.Dockerfile
    environment:
      REALTIME_HOST: "0.0.0.0"
      REALTIME_PORT: "4000"
      REALTIME_AUTH: "noauth"
      REALTIME_STATIC_DIR: "/app/static"
      RUST_LOG: "info,realtime_gateway=info,realtime_server=info"
    expose:
      - "4000"
    networks:
      drawnosaurus-internal:
        aliases: [realtime]   # see drawnosaurus-api
    restart: unless-stopped
    mem_limit: 512m

  drawnosaurus-web:
    build:
      context: ./apps/drawnosaurus
      dockerfile: docker/web.Dockerfile
      args:
        BUILD_APP_SHA: ${DRAWNOSAURUS_APP_SHA:-unknown}
        BUILD_ENGINE_SHA: ${DRAWNOSAURUS_ENGINE_SHA:-unknown}
    environment:
      PORT: "3000"
      # Both empty on purpose: the API and /ws are same-origin behind the gateway.
      PUBLIC_API_URL: ""
      PUBLIC_REALTIME_WS_URL: ""
    depends_on:
      - drawnosaurus-api
    expose:
      - "3000"
    networks:
      drawnosaurus-internal:
        aliases: [web]   # see drawnosaurus-api
    # $$PORT is the container's own PORT above (escaped so compose does not interpolate it): the probe follows PORT if it changes.
    # Ponytail: 3 s per probe (auth-gateway's value): a Node start slower than that on a loaded
    # host counts as unhealthy until a probe within the 12 retries makes it.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://127.0.0.1:$$PORT/'').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"',
        ]
      interval: 30s
      start_interval: 2s
      timeout: 3s
      start_period: 20s
      retries: 12
    restart: unless-stopped
    mem_limit: 512m

  # Caddy decides authority by ARRIVAL PORT: :80 = role `host` (everything), :81/:82 =
  # guest. We proxy to :80 because the board LIST must work; the capabilities :80 would
  # otherwise expose are taken back by nginx (layer 2) and by the missing tunnel target
  # (layer 3). :81 and :82 are never published and never reachable.
  drawnosaurus-gateway:
    image: caddy:2.10.2-alpine
    volumes:
      - ./apps/drawnosaurus/docker/gateway/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - drawnosaurus-api
      - drawnosaurus-realtime
      - drawnosaurus-web
    expose:
      - "80"
    networks:
      - drawnosaurus-internal
    # Ponytail: 3 s per probe; web:3000 answering slower than that reads as the gateway unhealthy.
    # :80 is not an env var here: it is the `:80 {` site block in the mounted
    # apps/drawnosaurus/docker/gateway/Caddyfile. `/` proxies to web:3000, so a green
    # check also means the gateway can reach the page the osionos iframe loads.
    healthcheck:
      test:
        ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      start_interval: 2s
      timeout: 3s
      start_period: 20s
      retries: 12
    restart: unless-stopped
    mem_limit: 256m

  # Build-only helper: produces engine/pkg on a bind mount. `make drawnosaurus-wasm` runs
  # it as the host user (rootful daemon) so the artifact is not root-owned. Never `up`.
  #
  # Deliberately on `default`, NOT drawnosaurus-internal: cargo fetches crates.io and a
  # git dependency (vtracer) from github.com, and the internal network has no egress —
  # putting it there fails the build with "failed to resolve address for github.com".
  # It costs nothing in isolation: this container is `run --rm`, never serves anything,
  # and never needs to reach the api, mongo or the gateway.
  #
  # This is now the ONLY drawnosaurus service that keeps a profile. The five runtime
  # services lost theirs so `make all` starts them, but this one must stay gated: its
  # CMD is the wasm build, so a service-less `up -d` would "start" it, run a compile and
  # exit — a failed container in `docker compose ps` on every boot. It is reached only by
  # `run --rm` from the drawnosaurus-wasm target, which passes --profile explicitly.
  drawnosaurus-wasm:
    profiles: [drawnosaurus]
    build:
      context: ./apps/drawnosaurus
      dockerfile: docker/wasm.Dockerfile
    volumes:
      - ./apps/drawnosaurus/engine:/engine
      - drawnosaurus-cargo-home:/cargo-home

volumes:
  osionos-ide-ledger:
  drawnosaurus-mongo-data:
  drawnosaurus-cargo-home:
  osionos-app-node-modules:
  osionos-app-pnpm-store:
  mail-node-modules:
  calendar-node-modules:
  osionos-browser-test-node-modules:
  osionos-browser-test-pnpm-store:
  # The AI plane (compose profile `ai`): the dev Postgres of the assistant and
  # the model caches of llama.cpp and of the embedder. The model volumes keep
  # their exact name — another task mounts the same caches. The database stays
  # project-scoped: it is the dev Postgres of this stack alone.
  osionos_ai_db:
  osionos_ai_models_llm:
    name: osionos_ai_models_llm
  osionos_ai_models_tei:
    name: osionos_ai_models_tei
  # The cache of the speech-to-text model (Systran/faster-whisper-small),
  # pre-fetched by the one-shot command of the osionos-ai-stt block.
  osionos_ai_models_stt:
    name: osionos_ai_models_stt
  # The classifiers' models, pre-fetched by the one-shot commands of the
  # osionos-ai-tox and osionos-ai-sentiment blocks.
  osionos_ai_models_tox:
    name: osionos_ai_models_tox
  osionos_ai_models_sentiment:
    name: osionos_ai_models_sentiment
  # The image engine's diffusion model and VAE, pre-fetched by the one-shot
  # command of the osionos-ai-sd block.
  osionos_sd_models:
    name: osionos_sd_models
  # The model of the prompt guard, pre-fetched by the one-shot command of the
  # osionos-ai-guard block.
  osionos_ai_guard_models:
    name: osionos_ai_guard_models
  # The models of the output check on the generated images (C73): filled by
  # osionos `services/osionos-ai/scripts/fetch-image-check.sh <dir>`, which
  # checks every byte against the lock of the spike (`spikes/a1/models.lock`).
  osionos_ai_image_check:
    name: osionos_ai_image_check
  # The VLM of "Describe image" (M7): the GGUF files under /vlm. They are
  # fetched and sha256-checked by `spikes/a1/fetch.py --only vlm` (osionos
  # services/osionos-ai), never by compose: the volume is external and mounted
  # read-only.
  osionos_ai_a1_data:
    name: osionos_ai_a1_data
    external: true

networks:
  # The grobase backend stack's network (docker project `mini-baas`), declared
  # external so the kept frontends can reach the grobase services by
  # container-name DNS (mini-baas-kong, mini-baas-gotrue, mini-baas-postgrest,
  # mini-baas-realtime, mini-baas-redis). The bridge, auth-gateway,
  # opposite-osiris-web, calendar-bridge and mail-bridge all attach to it.
  mini-baas:
    name: mini-baas_mini-baas
    external: true
  # The speech-to-text server of the dictation: `internal: true` = NO egress.
  # ONLY osionos-ai-stt and osionos-ai join it — the STT server is unreachable
  # from the bridge, from the web container and from the host, and it cannot
  # reach the internet either (the model is pre-fetched into its volume).
  osionos-ai-stt-net:
    internal: true
  # The image engine: `internal: true` = NO egress. ONLY osionos-ai-sd and
  # osionos-ai join it — the engine also serves /v1/images/edits, which the
  # service never calls (C72) and nothing else can reach.
  osionos-ai-sd-net:
    internal: true
  # The guard of the image prompt: `internal: true` = NO egress. ONLY
  # osionos-ai-guard and osionos-ai join it — the model is pre-fetched into
  # its volume, and the guard answers on this network and on no other.
  osionos-ai-guard-net:
    internal: true
  # The VLM of "Describe image": `internal: true` = NO egress. ONLY
  # osionos-ai-vlm and osionos-ai join it.
  osionos-ai-vlm-net:
    internal: true
  # The classifiers of the jobs worker: `internal: true` = NO egress. ONLY
  # osionos-ai-tox, osionos-ai-sentiment and osionos-ai-jobs join it.
  osionos-ai-classify-net:
    internal: true
  # Internal-only network for the IDE code runner: `internal: true` = NO egress
  # (the Docker daemon enforces it without needing unprivileged user namespaces),
  # so executed user code can reach neither the internet nor mini-baas. Only the
  # bridge and osionos-runner join it.
  osionos-runner-net:
    internal: true
  # drawnosaurus: `internal: true` = NO egress, so the cloudflared binary baked into its
  # api image could not dial out even if something started it (it cannot — see the service
  # block). Only drawnosaurus' own services and local-https-proxy join it; the gateway
  # deliberately does NOT join `default`, or every container in the project could reach the
  # API as Caddy's privileged `host` role.
  drawnosaurus-internal:
    internal: true
  # IDE control plane (socket-proxy ↔ ide-server): internal, no egress — the control
  # path never needs the internet. Only osionos-ide-socket-proxy and osionos-ide-server
  # join it; the bridge no longer attaches. The sandbox networks (internal sandbox-net +
  # the egress proxy) live INSIDE the docker-ide daemon, created by bootstrap.sh — not here.
  osionos-ide-control-net:
    internal: true
  # IDE TLS edge network: internal, no egress. Only local-https-proxy and osionos-ide-server
  # join it, so the browser reaches the IDE server exclusively through the TLS proxy on 8446.
  osionos-ide-edge-net:
    internal: true
