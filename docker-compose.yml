name: track-binocle

services:
  local-https-proxy:
    image: public.ecr.aws/docker/library/nginx:1.27-alpine
    volumes:
      - ./infrastructure/tls/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./apps/grobase/certs:/etc/track-binocle/certs:ro
    ports:
      - "${TRACK_BINOCLE_BIND_ADDR:-127.0.0.1}:${OPPOSITE_OSIRIS_HOST_PORT:-4322}:4322"
      - "${TRACK_BINOCLE_BIND_ADDR:-127.0.0.1}:${OSIONOS_APP_HOST_PORT:-3001}:3001"
      - "${TRACK_BINOCLE_BIND_ADDR:-127.0.0.1}:${OSIONOS_BRIDGE_HOST_PORT:-4000}:4000"
      - "${TRACK_BINOCLE_BIND_ADDR:-127.0.0.1}:${AUTH_GATEWAY_HOST_PORT:-8787}:8787"
      - "${TRACK_BINOCLE_BIND_ADDR:-127.0.0.1}:${MAIL_HOST_PORT:-3002}:3002"
      - "${TRACK_BINOCLE_BIND_ADDR:-127.0.0.1}:${MAIL_BRIDGE_PORT:-4100}:4100"
      - "${TRACK_BINOCLE_BIND_ADDR:-127.0.0.1}:${CALENDAR_HOST_PORT:-3003}:3003"
      - "${TRACK_BINOCLE_BIND_ADDR:-127.0.0.1}:${CALENDAR_BRIDGE_PORT:-4200}:4200"
    healthcheck:
      test: ["CMD-SHELL", "nginx -t >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 6
    restart: unless-stopped
    mem_limit: 128m

  # osionos-bridge — the editor's persistence/gateway, as its own self-contained
  # image (Docker Hub dlesieur/osionos-bridge), built FROM the osionos submodule
  # without modifying it. Pure Node, no npm deps. Config via env_file at runtime.
  osionos-bridge:
    image: ${OSIONOS_BRIDGE_IMAGE:-dlesieur/osionos-bridge:latest}
    build:
      context: ./apps/osionos/app
      dockerfile: ../../../infrastructure/docker/osionos/bridge.Dockerfile
    env_file:
      - path: ./.env.local
        required: false
      # secrets injected at up-time from ./.env.local
    environment:
      OSIONOS_BRIDGE_PORT: 4000
      OSIONOS_APP_URL: ${OSIONOS_APP_URL:-https://localhost:3001}
      OSIONOS_ALLOWED_ORIGIN: ${OSIONOS_ALLOWED_ORIGIN:-https://localhost:3001}
      # BaaS reads/writes go to the grobase-owned mini-baas Kong over the
      # external mini-baas network (container-name DNS).
      OSIONOS_BAAS_URL: http://mini-baas-kong:8000
      # The adapter-registry (the database LIST) is keyed by tenant; the bridge
      # resolves it server-side so the browser never has to pass ?tenant= (and
      # so a missing hint can't 503 us into the env mock mounts). Same tenant the
      # permission proxy uses below (PERMS_TENANT_ID).
      OSIONOS_BAAS_TENANT_ID: ${OSIONOS_BAAS_TENANT_ID:-agency}
      AUTH_GATEWAY_URL: ${AUTH_GATEWAY_URL:-http://auth-gateway:8787}
      OSIONOS_BRIDGE_PERSISTENCE: ${OSIONOS_BRIDGE_PERSISTENCE:-auto}
      OSIONOS_BRIDGE_REQUIRE_BAAS: ${OSIONOS_BRIDGE_REQUIRE_BAAS:-false}
      CLAUDE_BIN: ${CLAUDE_BIN:-claude}
      # LiveKit video tokens (scripts/bridge-rtc.mjs): same key pair as the
      # livekit service below; LIVEKIT_URL is the in-network admin/twirp base,
      # LIVEKIT_CLIENT_URL is what browsers get back to connect the room.
      LIVEKIT_URL: ${LIVEKIT_URL:-http://livekit:7880}
      LIVEKIT_CLIENT_URL: ${LIVEKIT_CLIENT_URL:-ws://127.0.0.1:7880}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-devsecret-livekit-local-0123456789abcdef}
      # Permission UX proxy (scripts/bridge-perms.mjs) → mini-baas Kong over
      # the external mini-baas network (container-name DNS; the bare "kong"
      # alias is ambiguous from here because this service sits on BOTH
      # networks). PERMS_SERVICE_APIKEY / PERMS_SERVICE_TOKEN come from
      # ./.env.local via env_file (secrets stay out of compose).
      PERMS_KONG_URL: ${PERMS_KONG_URL:-http://mini-baas-kong:8000}
      PERMS_TENANT_ID: ${PERMS_TENANT_ID:-agency}
      PERMS_PEOPLE_ENV: /seeds/.agency-people.env
      PERMS_RULES_FILE: /tmp/perms-rules.json
      # Chat/feed realtime publishes (scripts/bridge-chat.mjs, bridge-feed.mjs)
      # go server-side to the Rust realtime gateway: POST /v1/publish.
      REALTIME_PUBLISH_URL: ${REALTIME_PUBLISH_URL:-http://mini-baas-realtime:4000}
      # Agency org workspace: scopes /api/people + default feed topic.
      OSIONOS_ORG_WORKSPACE_ID: ${OSIONOS_ORG_WORKSPACE_ID:-b1a0c1e5-0000-4000-a000-000000000001}
      # IDE code runner (P3) — DOUBLE-GATED, default DISABLED. The /api/ide/run
      # route is off unless this URL is set AND the `runner` compose profile is
      # started. Ships EMPTY on purpose (never set in shared/parity/fly without a
      # human go-ahead). Enable locally: OSIONOS_RUNNER_URL=http://osionos-runner:7900
      # plus `COMPOSE_PROFILES=runner`.
      OSIONOS_RUNNER_URL: ${OSIONOS_RUNNER_URL:-}
      HOME: ${OSIONOS_BRIDGE_HOME:-/tmp}
      PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    expose:
      - "4000"
    volumes:
      - ./tools/seeds/.agency-people.env:/seeds/.agency-people.env:ro
    networks:
      - default
      - mini-baas
      # Reaches the (optional, profile-gated) code runner over an internal-only
      # network — no effect until the `runner` profile is up + OSIONOS_RUNNER_URL set.
      - osionos-runner-net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://127.0.0.1:4000/api/auth/bridge/health'').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"',
        ]
      interval: 5s
      timeout: 3s
      start_period: 45s
      retries: 24
    restart: unless-stopped
    mem_limit: 512m

  # osionos-runner — the IDE code-execution sandbox (P3). Runs untrusted user
  # source in ~13 languages. The CONTAINER is the sandbox: nsjail can't create
  # namespaces under cap_drop:ALL on this host (apparmor_restrict_unprivileged_userns=1),
  # so hardening lives here and was PROVEN with a hostile corpus (fork bomb,
  # infinite loop, 4GB alloc, egress, fs-escape, unshare — all contained, no
  # CAP_SYS_ADMIN). Reachable ONLY from the bridge over the internal network,
  # never the browser, never mini-baas. Behind the `runner` profile → NOT started
  # by `make all`; enable with COMPOSE_PROFILES=runner + OSIONOS_RUNNER_URL set.
  osionos-runner:
    build:
      context: infrastructure/docker/osionos/runner
    image: ${OSIONOS_RUNNER_IMAGE:-dlesieur/osionos-runner:latest}
    container_name: track-binocle-osionos-runner
    profiles: ["runner"]
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    ulimits:
      nproc: 256
      fsize: 16000000
      cpu: 20
    tmpfs:
      - /work:size=64m,mode=1777
      - /tmp:size=16m,mode=1777
    environment:
      RUNNER_PORT: "7900"
    expose:
      - "7900"
    networks:
      - osionos-runner-net

  # livekit — self-hosted WebRTC SFU for osionos video rooms. Signalling/HTTP
  # (and the twirp admin API) on 7880, TCP ICE fallback on 7881, media over a
  # modest UDP range 50000-50060 published 1:1 (config advertises 127.0.0.1).
  # API keys flow from LIVEKIT_API_KEY/LIVEKIT_API_SECRET (dev defaults below,
  # registered in .env.example like the other optional secrets); the
  # osionos-bridge mints HS256 access tokens for the SAME pair via
  # apps/osionos/app/scripts/bridge-rtc.mjs (POST /api/rtc/token).
  livekit:
    image: ${LIVEKIT_IMAGE:-livekit/livekit-server:v1.11.0}
    profiles:
      - dev
      - local
    command: --config /etc/livekit.yaml
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:-devkey}: ${LIVEKIT_API_SECRET:-devsecret-livekit-local-0123456789abcdef}"
    volumes:
      - ./infrastructure/livekit/livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "${TRACK_BINOCLE_BIND_ADDR:-127.0.0.1}:${LIVEKIT_HOST_PORT:-7880}:7880"
      - "${TRACK_BINOCLE_BIND_ADDR:-127.0.0.1}:${LIVEKIT_TCP_HOST_PORT:-7881}:7881"
      - "${TRACK_BINOCLE_BIND_ADDR:-127.0.0.1}:50000-50060:50000-50060/udp"
    restart: unless-stopped
    mem_limit: 512m

  # osionos-app — the block editor as a standalone STATIC image (Docker Hub
  # dlesieur/osionos-app), built FROM the submodule without modifying it. VITE_*
  # are baked at build; nginx serves the build on :80 and the editor talks to the
  # osionos-bridge cross-origin at VITE_API_URL. Fronted by local-https-proxy :3001.
  osionos-app:
    image: ${OSIONOS_APP_IMAGE:-dlesieur/osionos-app:latest}
    profiles:
      - dev
    build:
      context: ./apps/osionos/app
      dockerfile: ../../../infrastructure/docker/osionos/app.Dockerfile
      args:
        VITE_API_URL: https://localhost:${OSIONOS_BRIDGE_HOST_PORT:-4000}
        VITE_PRISMATICA_URL: https://localhost:${OPPOSITE_OSIRIS_HOST_PORT:-4322}
        VITE_MAIL_APP_URL: https://localhost:${MAIL_HOST_PORT:-3002}
        VITE_CALENDAR_APP_URL: https://localhost:${CALENDAR_HOST_PORT:-3003}
        VITE_REQUIRE_BRIDGE_SESSION: "true"
        VITE_ALLOW_OFFLINE_MODE: "false"
        VITE_PAGE_ACTION_SYNC_ENABLED: "true"
        # mini-baas live-database + graph wiring (Vite inlines at build).
        # Empty defaults keep those surfaces dormant; `make seed-live-demo`
        # at the repo root rebuilds this image with the values from the app
        # .env (see infrastructure/makes/baas.mk).
        VITE_BAAS_URL: ${VITE_BAAS_URL:-}
        VITE_BAAS_API_KEY: ${VITE_BAAS_API_KEY:-}
        VITE_BAAS_KONG_KEY: ${VITE_BAAS_KONG_KEY:-}
        VITE_BAAS_LIVE_MOUNTS: ${VITE_BAAS_LIVE_MOUNTS:-}
        VITE_BAAS_REALTIME_TOKEN: ${VITE_BAAS_REALTIME_TOKEN:-}
        VITE_BAAS_TENANT_ID: ${VITE_BAAS_TENANT_ID:-}
        VITE_GIPHY_API_KEY: ${GIPHY_API:-}
        VITE_BAAS_EDGES_DB_ID: ${VITE_BAAS_EDGES_DB_ID:-}
        VITE_BAAS_EDGES_TABLE: ${VITE_BAAS_EDGES_TABLE:-}
        VITE_BAAS_GRAPH_RESOURCES: ${VITE_BAAS_GRAPH_RESOURCES:-}
        VITE_BAAS_GRAPH_GENERATORS: ${VITE_BAAS_GRAPH_GENERATORS:-}
        VITE_BAAS_NOTES_TABLE: ${VITE_BAAS_NOTES_TABLE:-}
        VITE_BAAS_OVERLAY_TABLE: ${VITE_BAAS_OVERLAY_TABLE:-}
    expose:
      - "80"
    depends_on:
      osionos-bridge:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      start_period: 15s
      retries: 20
    restart: unless-stopped
    mem_limit: 128m

  mail-bridge:
    image: ${MAIL_BRIDGE_IMAGE:-track-binocle/mail-bridge:local}
    profiles:
      - dev
    build:
      context: ./apps/mail
      target: dev
    working_dir: /app
    command: ["npm", "run", "bridge"]
    env_file:
      - path: ./apps/mail/.env
        required: false
      - path: ./apps/mail/.env.local
        required: false
    environment:
      NODE_ENV: development
      MAIL_BRIDGE_PORT: ${MAIL_BRIDGE_PORT:-4100}
      MAIL_APP_ORIGIN: https://localhost:${MAIL_HOST_PORT:-3002}
      MAIL_BRIDGE_PUBLIC_ORIGIN: https://localhost:${MAIL_BRIDGE_PORT:-4100}
      GMAIL_REDIRECT_URI: https://localhost:${MAIL_BRIDGE_PORT:-4100}/auth/gmail/callback
      VAULT_ADDR: ${MAIL_BRIDGE_VAULT_ADDR:-http://vault:8200}
    volumes:
      - ./apps/mail:/app
      - mail-node-modules:/app/node_modules
    expose:
      - "4100"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - mini-baas
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "const port=process.env.MAIL_BRIDGE_PORT||4100; fetch(''http://127.0.0.1:''+port+''/health'').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"',
        ]
      interval: 5s
      timeout: 3s
      start_period: 20s
      retries: 12
    restart: unless-stopped
    mem_limit: 512m

  mail:
    image: ${MAIL_IMAGE:-track-binocle/mail:local}
    profiles:
      - dev
    build:
      context: ./apps/mail
      target: dev
    working_dir: /app
    command: ["npm", "run", "dev"]
    env_file:
      - path: ./apps/mail/.env
        required: false
      - path: ./apps/mail/.env.local
        required: false
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"
      VITE_MAIL_BRIDGE_URL: https://localhost:${MAIL_BRIDGE_PORT:-4100}
    volumes:
      - ./apps/mail:/app
      - mail-node-modules:/app/node_modules
    expose:
      - "3002"
    depends_on:
      mail-bridge:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://127.0.0.1:3002'').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"',
        ]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 20
    restart: unless-stopped
    mem_limit: 1g

  calendar-bridge:
    image: ${CALENDAR_BRIDGE_IMAGE:-track-binocle/calendar-bridge:local}
    profiles:
      - dev
    build:
      context: ./apps/calendar
      target: dev
    working_dir: /app
    command: ["npm", "run", "bridge"]
    env_file:
      - path: ./apps/calendar/.env
        required: false
      - path: ./apps/mail/.env
        required: false
      - path: ./.env.local
        required: false
      - path: ./apps/calendar/.env.local
        required: false
      # secrets injected at up-time from ./.env.local
    environment:
      NODE_ENV: development
      CALENDAR_BRIDGE_PORT: ${CALENDAR_BRIDGE_PORT:-4200}
      CALENDAR_APP_ORIGIN: https://localhost:${CALENDAR_HOST_PORT:-3003}
      CALENDAR_BRIDGE_PUBLIC_ORIGIN: https://localhost:${CALENDAR_BRIDGE_PORT:-4200}
      CALENDAR_REDIRECT_URI: https://localhost:${CALENDAR_BRIDGE_PORT:-4200}/auth/google/callback
      CALENDAR_BAAS_URL: http://mini-baas-kong:8000
      CALENDAR_BAAS_PUBLIC_URL: https://localhost:${KONG_HTTP_PORT:-8000}
      VAULT_ADDR: ${CALENDAR_BRIDGE_VAULT_ADDR:-http://vault:8200}
    volumes:
      - ./apps/calendar:/app
      - calendar-node-modules:/app/node_modules
    expose:
      - "4200"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - mini-baas
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "const port=process.env.CALENDAR_BRIDGE_PORT||4200; fetch(''http://127.0.0.1:''+port+''/health'').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"',
        ]
      interval: 5s
      timeout: 3s
      start_period: 20s
      retries: 12
    restart: unless-stopped
    mem_limit: 512m

  calendar:
    image: ${CALENDAR_IMAGE:-track-binocle/calendar:local}
    profiles:
      - dev
    build:
      context: ./apps/calendar
      target: dev
    working_dir: /app
    command: ["npm", "run", "dev"]
    env_file:
      - path: ./apps/calendar/.env
        required: false
      - path: ./apps/calendar/.env.local
        required: false
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"
      VITE_CALENDAR_BRIDGE_URL: https://localhost:${CALENDAR_BRIDGE_PORT:-4200}
      VITE_CALENDAR_BAAS_URL: https://localhost:${KONG_HTTP_PORT:-8000}
    volumes:
      - ./apps/calendar:/app
      - calendar-node-modules:/app/node_modules
    expose:
      - "3003"
    depends_on:
      calendar-bridge:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://127.0.0.1:3003'').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"',
        ]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 20
    restart: unless-stopped
    mem_limit: 1g

  # prismatica-auth-gateway — the custom API gateway / auth BFF, as its own
  # self-contained image (Docker Hub dlesieur/prismatica-auth-gateway). PULL-ONLY:
  # the opposite-osiris source was removed from this repo, so there is no local
  # build path — rebuild the image from the opposite-osiris source elsewhere.
  # Server-only secrets (SERVICE_ROLE_KEY, OSIONOS_BRIDGE_SHARED_SECRET,
  # TURNSTILE_SECRET_KEY, SMTP) are injected at RUNTIME via env_file below.
  auth-gateway:
    image: ${AUTH_GATEWAY_IMAGE:-dlesieur/prismatica-auth-gateway:latest}
    profiles:
      - dev
      - local
    env_file:
      - path: ./.env.local
        required: false
      # secrets injected at up-time from ./.env.local
    environment:
      AUTH_GATEWAY_PORT: 8787
      PUBLIC_BAAS_URL: http://mini-baas-kong:8000
      OSIONOS_BRIDGE_URL: http://osionos-bridge:4000/api/auth/bridge/session
      PUBLIC_SITE_URL: https://localhost:${OPPOSITE_OSIRIS_HOST_PORT:-4322}
      AUTH_REQUIRE_EMAIL_VERIFICATION: ${AUTH_REQUIRE_EMAIL_VERIFICATION:-false}
      PUBLIC_AUTH_REQUIRE_EMAIL_VERIFICATION: ${PUBLIC_AUTH_REQUIRE_EMAIL_VERIFICATION:-false}
      # Turnstile config used to live in opposite-osiris/.env.local (now removed).
      # Behavior flag defaults to bypass for local (prod sets it false). The
      # SECRET itself is NOT set here on purpose — `environment:` overrides
      # `env_file:`, so an empty default would clobber the Vault-fetched value.
      # TURNSTILE_SECRET_KEY is injected at up-time from ./.env.local.
      TURNSTILE_BYPASS_LOCAL: ${TURNSTILE_BYPASS_LOCAL:-true}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_ENCRYPTION: ${SMTP_ENCRYPTION:-none}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_ADDRESS: ${SMTP_FROM_ADDRESS:-noreply@mini-baas.local}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Prismatica}
      MAILPIT_API_URL: http://mailpit:8025
      MAILPIT_VERIFY_DELIVERY: ${MAILPIT_VERIFY_DELIVERY:-true}
      # --- security hardening (prismatica auth-gateway) ---
      # Real browser traffic reaches the gateway through 2 appending reverse
      # proxies: local-https-proxy(4322) -> opposite-osiris-web(8080) -> gateway.
      # Deriving the client IP from that trusted hop count means a spoofed
      # X-Forwarded-For cannot mint fresh rate-limit buckets (HIGH-1).
      AUTH_TRUSTED_PROXY_HOPS: ${AUTH_TRUSTED_PROXY_HOPS:-2}
      # Shared, restart-surviving rate-limit / lockout / anti-replay state.
      # Falls back to a bounded in-memory store if Redis is unreachable.
      REDIS_URL: ${AUTH_GATEWAY_REDIS_URL:-redis://mini-baas-redis:6379}
      # osionos origin used to validate the bridge redirect target (LOW-3).
      PUBLIC_OSIONOS_APP_URL: ${PUBLIC_OSIONOS_APP_URL:-https://localhost:3001}
    expose:
      - "8787"
    networks:
      - default
      - mini-baas
    depends_on:
      osionos-bridge:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://127.0.0.1:8787/api/auth/availability'').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"',
        ]
      interval: 5s
      timeout: 3s
      start_period: 20s
      retries: 12
    restart: unless-stopped
    mem_limit: 256m

  # opposite-osiris WEBSITE — served as a STANDALONE image (Docker Hub
  # dlesieur/opposite-osiris-web): nginx serves the static `astro build` output
  # AND reverse-proxies /api/* to the BaaS, mirroring the old Vite dev-proxy
  # routing. Fronted by local-https-proxy at :4322. PULL-ONLY: the opposite-osiris
  # source was removed from this repo, so there is no local build path — rebuild
  # the image from the opposite-osiris source elsewhere.
  opposite-osiris-web:
    profiles:
      - dev
    image: ${OPPOSITE_OSIRIS_WEB_IMAGE:-dlesieur/opposite-osiris-web:latest}
    environment:
      # Runtime, env-driven BaaS upstreams. Default to the local stack's service
      # DNS; override (e.g. OO_BAAS_UPSTREAM=https://baas.example.com) for prod.
      OO_AUTH_UPSTREAM: ${OO_AUTH_UPSTREAM:-http://auth-gateway:8787}
      OO_BAAS_UPSTREAM: ${OO_BAAS_UPSTREAM:-http://mini-baas-kong:8000}
      OO_RESOLVER: ${OO_RESOLVER:-127.0.0.11}
    expose:
      - "8080"
    # Optional direct (plain-HTTP) access for debugging, bypassing the TLS proxy.
    ports:
      - "${TRACK_BINOCLE_BIND_ADDR:-127.0.0.1}:${OPPOSITE_OSIRIS_WEB_HOST_PORT:-4323}:8080"
    networks:
      - default
      - mini-baas
    depends_on:
      auth-gateway:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:8080/ >/dev/null 2>&1 || exit 1",
        ]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 5
    restart: unless-stopped
    mem_limit: 128m

  playground-simulation:
    profiles:
      - testing
    image: ${PLAYGROUND_SIMULATION_IMAGE:-track-binocle/playground-simulation:local}
    build:
      context: ./apps/osionos/app
      dockerfile: docker/services/browser-tests/Dockerfile
    working_dir: /app
    init: true
    ipc: host
    network_mode: host
    environment:
      CI: "1"
      NODE_ENV: test
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      PLAYGROUND_WEBSITE_URL: https://127.0.0.1:4322
      PLAYGROUND_APP_URL: https://127.0.0.1:3001
      PLAYGROUND_BRIDGE_URL: https://127.0.0.1:4000
      PLAYGROUND_MAIL_URL: https://127.0.0.1:3002
      PLAYGROUND_MAIL_BRIDGE_URL: https://127.0.0.1:4100
      PLAYGROUND_CALENDAR_URL: https://127.0.0.1:3003
      PLAYGROUND_CALENDAR_BRIDGE_URL: https://127.0.0.1:4200
      NODE_EXTRA_CA_CERTS: /certs/track-binocle-local-ca.pem
      PLAYGROUND_VIEWER_DIR: /app/public/playground-simulation
      PLAYGROUND_HEADLESS: ${PLAYGROUND_HEADLESS:-1}
      PLAYGROUND_SLOWMO_MS: ${PLAYGROUND_SLOWMO_MS:-80}
    volumes:
      - ./apps/osionos/app:/app
      - ./apps/grobase/certs:/certs:ro
      - osionos-browser-test-node-modules:/app/node_modules
      - osionos-browser-test-pnpm-store:/pnpm/store
    entrypoint:
      ["/bin/bash", "/app/docker/services/browser-tests/entrypoint.sh"]
    command: ["node", "scripts/playground-simulation.mjs"]

  # agency-simulation — the Binocle Intelligence Agency end-to-end Playwright
  # run (make agency-sim): multi-context org simulation (owner + employees)
  # over the REAL stack. Same image/harness as playground-simulation; host
  # networking reaches the website (4322), app (3001), bridge (4000), root
  # Kong (8000), mini-baas Kong (8002), Mailpit (8025) and LiveKit (7880).
  # env_file supplies SERVICE_ROLE_KEY for the gotrue invite leg.
  agency-simulation:
    profiles:
      - testing
    image: ${PLAYGROUND_SIMULATION_IMAGE:-track-binocle/playground-simulation:local}
    build:
      context: ./apps/osionos/app
      dockerfile: docker/services/browser-tests/Dockerfile
    working_dir: /app
    init: true
    ipc: host
    network_mode: host
    env_file:
      - path: ./.env.local
        required: false
      # secrets injected at up-time from ./.env.local
    environment:
      CI: "1"
      NODE_ENV: test
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      AGENCY_WEBSITE_URL: https://127.0.0.1:4322
      AGENCY_APP_URL: https://127.0.0.1:3001
      AGENCY_BRIDGE_URL: https://127.0.0.1:4000
      AGENCY_KONG_URL: https://127.0.0.1:8000
      AGENCY_MAILPIT_URL: http://127.0.0.1:8025
      AGENCY_LIVEKIT_HTTP_URL: http://127.0.0.1:7880
      AGENCY_ARTIFACTS_DIR: /app/test-results/agency-simulation
      AGENCY_PEOPLE_ENV: /seeds/.agency-people.env
      AGENCY_TENANT_ENV: /seeds/.agency-tenant.env
      AGENCY_HEADLESS: ${AGENCY_HEADLESS:-1}
      AGENCY_SLOWMO_MS: ${AGENCY_SLOWMO_MS:-40}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-devsecret-livekit-local-0123456789abcdef}
      NODE_EXTRA_CA_CERTS: /certs/track-binocle-local-ca.pem
    volumes:
      - ./apps/osionos/app:/app
      - ./apps/grobase/certs:/certs:ro
      - ./tools/seeds/.agency-people.env:/seeds/.agency-people.env:ro
      - osionos-browser-test-node-modules:/app/node_modules
      - osionos-browser-test-pnpm-store:/pnpm/store
    entrypoint:
      ["/bin/bash", "/app/docker/services/browser-tests/entrypoint.sh"]
    command: ["node", "scripts/agency-simulation.mjs"]

  # Grobase marketing-site quality gate — backs `make grobase-audit` and
  # `make grobase-e2e`. Builds the website's `audit` Dockerfile stage (system
  # Chromium + Lighthouse + pa11y) and runs the self-contained gate (astro build →
  # HTTP preview on :4325 → html-validate + CSP check + pa11y WCAG2AA + Lighthouse
  # >=90 ×4). Self-contained: no published ports, no backend network needed.
  grobase-site-audit:
    profiles:
      - grobase
    build:
      context: ./apps/grobase/vendor/grobase-website
      dockerfile: Dockerfile
      target: audit
    image: track-binocle/grobase-site-audit:local

  # ── IDE sandbox plane (profile `ide`; NEVER started by `make all`) ──────────
  # A DEDICATED, ISOLATED rootless Docker daemon that runs the per-(user,
  # workspace) IDE sandboxes on its OWN data-root — a separate daemon from the
  # host daemon that runs mini-baas, so a sandbox/provisioner compromise cannot
  # see the backend (devil condition 1). Rootless = no `privileged`. Requires
  # host support (cgroup v2 delegation + /etc/subuid,subgid) — see the runbook
  # infrastructure/docker/osionos/ide-sandbox/README.md. Its socket is shared to
  # the filter over a volume, never published to the host or a sandbox net.
  osionos-ide-dockerd:
    image: ${OSIONOS_IDE_DIND_IMAGE:-docker:27-dind-rootless}
    container_name: track-binocle-osionos-ide-dockerd
    profiles: ["ide"]
    restart: unless-stopped
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
    environment:
      DOCKER_HOST: unix:///dind-run/docker.sock
      DOCKER_TLS_CERTDIR: ""
    command:
      - "--host=unix:///dind-run/docker.sock"
      - "--group=0"
    volumes:
      - osionos-ide-dind-data:/home/rootless/.local/share/docker
      - osionos-ide-dind-sock:/dind-run
    networks:
      # Egress-capable: the IN-dind egress proxy reaches registries/git through
      # here. The SANDBOXES sit on an internal net INSIDE this daemon, one hop
      # behind that proxy — the two-layer isolation.
      - osionos-ide-egress-net

  # The filtering docker-socket proxy — the ONLY path from the provisioner to the
  # dind daemon (condition 2). Fronts the dind unix socket (shared volume),
  # exposes a filtered TCP endpoint that allowlists endpoints AND vets the create
  # body (condition 8). Reachable only by the bridge on the internal control net.
  osionos-ide-socket-proxy:
    build:
      context: infrastructure/docker/osionos/ide-socket-proxy
    image: ${OSIONOS_IDE_SOCKET_PROXY_IMAGE:-osionos-ide-socket-proxy:latest}
    container_name: track-binocle-osionos-ide-socket-proxy
    profiles: ["ide"]
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      IDE_DOCKER_SOCK: /dind-run/docker.sock
    volumes:
      - osionos-ide-dind-sock:/dind-run
    expose:
      - "2375"
    networks:
      - osionos-ide-control-net
    depends_on:
      - osionos-ide-dockerd

volumes:
  osionos-app-node-modules:
  osionos-app-pnpm-store:
  mail-node-modules:
  calendar-node-modules:
  osionos-browser-test-node-modules:
  osionos-browser-test-pnpm-store:
  # IDE plane: the isolated dind daemon's data-root + its shared socket dir.
  osionos-ide-dind-data:
  osionos-ide-dind-sock:

networks:
  # The grobase backend stack's network (docker project `mini-baas`), declared
  # external so the kept frontends can reach the grobase services by
  # container-name DNS (mini-baas-kong, mini-baas-gotrue, mini-baas-postgrest,
  # mini-baas-realtime, mini-baas-redis). The bridge, auth-gateway,
  # opposite-osiris-web, calendar-bridge and mail-bridge all attach to it.
  mini-baas:
    name: mini-baas_mini-baas
    external: true
  # Internal-only network for the IDE code runner: `internal: true` = NO egress
  # (the Docker daemon enforces it without needing unprivileged user namespaces),
  # so executed user code can reach neither the internet nor mini-baas. Only the
  # bridge and osionos-runner join it.
  osionos-runner-net:
    internal: true
  # IDE control plane (bridge ↔ socket-proxy): internal, no egress — the control
  # path never needs the internet. The bridge joins this to reach the filter at
  # osionos-ide-socket-proxy:2375 (OSIONOS_IDE_DOCKER_HOST).
  osionos-ide-control-net:
    internal: true
  # The isolated dind daemon's own network — egress-capable, because the IN-dind
  # egress proxy reaches registries/git through it. It carries NO backend route:
  # it is a fresh bridge network, never joined to mini-baas.
  osionos-ide-egress-net:
