    env_file:
      - path: ./apps/mail/.env
        required: false
      - path: ./apps/mail/.env.local
        required: false
    environment:
      NODE_ENV: development
      MAIL_BRIDGE_PORT: ${MAIL_BRIDGE_PORT:-4100}
      MAIL_APP_ORIGIN: https://localhost:${MAIL_HOST_PORT:-3002}
      MAIL_BRIDGE_PUBLIC_ORIGIN: https://localhost:${MAIL_BRIDGE_PORT:-4100}
      GMAIL_REDIRECT_URI: https://localhost:${MAIL_BRIDGE_PORT:-4100}/auth/gmail/callback
      VAULT_ADDR: ${MAIL_BRIDGE_VAULT_ADDR:-http://vault:8200}
    volumes:
      - ./apps/mail:/app
      - mail-node-modules:/app/node_modules
    expose:
      - "4100"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - mini-baas
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "const port=process.env.MAIL_BRIDGE_PORT||4100; fetch(''http://127.0.0.1:''+port+''/health'').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"',
        ]
