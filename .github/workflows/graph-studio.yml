name: graph-studio pack in osionos-app

# Builds osionos-app the way make does (compose, GRAPH_RENDER_SHA = the apps/graph_render
# gitlink) and runs the built image: the pinned graph_render pack must be served byte-exact
# under /graph-studio/<gitlink>/, a missing file there must 404 instead of falling back to the
# SPA, index.html must name the base, and the build must refuse a pack from another commit.
# No registry login: the pack has to be pullable anonymously, like on a fresh clone.

on:
  push:
    branches: [develop, main]
    paths:
      - ".github/workflows/graph-studio.yml"
      - "infrastructure/docker/osionos/app.Dockerfile"
      - "infrastructure/docker/osionos/app.Dockerfile.dockerignore"
      - "docker-compose.yml"
      - "tests/graph-studio/**"
      - "apps/graph_render"
      - "apps/osionos/app"
  pull_request:
    paths:
      - ".github/workflows/graph-studio.yml"
      - "infrastructure/docker/osionos/app.Dockerfile"
      - "infrastructure/docker/osionos/app.Dockerfile.dockerignore"
      - "docker-compose.yml"
      - "tests/graph-studio/**"
      - "apps/graph_render"
      - "apps/osionos/app"
  workflow_dispatch:

concurrency:
  group: graph-studio-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  serve:
    name: build osionos-app + serve the pack (bats)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: osionos checkout (the build context, with its nested packages)
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init --recursive apps/osionos/app
      - name: base images from mirror.gcr.io under their public.ecr.aws names
        # The ECR cap outlasts minutes of retry on one runner IP (job 3d19b714: 3 attempts, all 429).
        # mirror.gcr.io serves the same Docker Official Images; tagged locally under the ECR name,
        # the docker-driver build uses them and never asks ECR. Caveat: the two registries move a
        # tag independently, so right after an upstream release the mirror can lag a digest behind.
        run: |
          for img in node:22-alpine nginx:1.27-alpine; do
            docker pull -q "mirror.gcr.io/library/$img"
            docker tag "mirror.gcr.io/library/$img" "public.ecr.aws/docker/library/$img"
          done
      - name: build osionos-app as make does
        # Retries only a registry refusal: public.ecr.aws caps anonymous data per runner IP
        # ("429 Data limit exceeded", job 117478667141). Caveat: "registry-shaped" is a grep
        # of the log; a real build error is never retried, an oddly worded limit is not either.
        shell: bash
        run: |
          GRAPH_RENDER_SHA="$(git ls-tree HEAD apps/graph_render | awk '$2 == "commit" { print $3 }')"
          export GRAPH_RENDER_SHA
          echo "GRAPH_RENDER_SHA=$GRAPH_RENDER_SHA"
          for i in 1 2 3; do
            docker compose --profile dev --progress plain build osionos-app 2>&1 | tee "$RUNNER_TEMP/build.log" && exit 0
            grep -qiE 'toomanyrequests|429 Too Many Requests|unexpected status code [^:]*: 5[0-9][0-9]' "$RUNNER_TEMP/build.log" || exit 1
            echo "::warning::registry refused the base image pull (attempt $i/3), retrying in $((i * 60))s"
            sleep $((i * 60))
          done
          exit 1
      - name: image size and the layers the pack adds
        run: |
          img=track-binocle/osionos-web:local
          docker image inspect -f 'image bytes: {{.Size}}' "$img"
          docker history --format '{{.Size}}\t{{.CreatedBy}}' "$img" | sed -n 1,8p
          docker run --rm --entrypoint du "$img" -sb /usr/share/nginx/html/graph-studio
      - name: install bats
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bats
      - name: bats tests/graph-studio (no skips allowed)
        env:
          GS_IMAGE: track-binocle/osionos-web:local
          GS_BUILD: "1"
        # explicit `shell: bash` adds -o pipefail: without it, tee's exit status hides a bats failure
        shell: bash
        run: |
          bats tests/graph-studio | tee "$RUNNER_TEMP/bats.log"
          if grep -q '# skip' "$RUNNER_TEMP/bats.log"; then echo "::error::a graph-studio test was skipped"; exit 1; fi
