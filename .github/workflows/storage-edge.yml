name: storage edge sandbox (:3001)

# Runs the real infrastructure/tls/nginx.conf in the image compose runs it in, in front of a
# stub osionos-app + Kong, and checks that /storage/v1/* on the app origin is sent with
# CSP sandbox + nosniff while every response keeps the anti-framing headers (ruling SG-9).
# The fresh-machine bats job skips this file (no docker there), so this job is its gate.
# Seconds, no secrets, no stack.

on:
  push:
    branches: [develop, main]
    paths:
      - ".github/workflows/storage-edge.yml"
      - "infrastructure/tls/nginx.conf"
      - "scripts/tests/storage-edge-sandbox.bats"
  pull_request:
    paths:
      - ".github/workflows/storage-edge.yml"
      - "infrastructure/tls/nginx.conf"
      - "scripts/tests/storage-edge-sandbox.bats"
  workflow_dispatch:

concurrency:
  group: storage-edge-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sandbox:
    name: /storage/v1 sandbox + framing headers against the real nginx.conf (bats)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: nginx from mirror.gcr.io under its public.ecr.aws name
        # Same reason as hydrawn-edge.yml: public.ecr.aws rate-limits anonymous pulls per runner IP.
        run: |
          docker pull -q mirror.gcr.io/library/nginx:1.27-alpine
          docker tag mirror.gcr.io/library/nginx:1.27-alpine public.ecr.aws/docker/library/nginx:1.27-alpine
      - name: install bats
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bats
      - name: bats scripts/tests/storage-edge-sandbox.bats (no skips allowed)
        # explicit `shell: bash` adds -o pipefail: without it, tee's exit status hides a bats failure
        shell: bash
        run: |
          bats scripts/tests/storage-edge-sandbox.bats | tee "$RUNNER_TEMP/bats.log"
          if grep -q '# skip' "$RUNNER_TEMP/bats.log"; then echo "::error::a storage-edge test was skipped"; exit 1; fi
