name: Fresh-Machine Migration

# THE migration test, exactly as it must work on your other Ubuntu machine:
#   git clone --recursive   →   make all   →   everything is up.
# A clean ubuntu-latest runner IS the new machine. The only thing that is NOT in the
# clone — and cannot be, by zero-knowledge design — is the vault key, placed here from a
# secret the way you'd copy ~/.config/42ctl/keystore.v42 once (like installing Docker).
# `make all` then self-provisions: sync submodules → pull secrets from vault42 (a saved 42ctl
# session, no OTP: the CLI answers "not logged in" to keystore + contract alone since grobase's
# 2026-10-07 vault42 rework, run 38014839046) →
# start the grobase backend (all public-image engines) → restore the all-engine snapshot →
# build+start the frontends → healthcheck. If this is red, the project isn't good enough.
#
# Two modes, decided by whether VAULT42_SESSION_B64 is set:
#   team   the migration proper: vault pull, all-engine restore, data proven in 6 engines.
#   local  the documented no-vault path (`make all` with no keystore): self-generated
#          secrets, empty engines, demo account created by demo-login-ensure, full stack +
#          healthcheck. The pull and the restore are NOT exercised and the summary says so:
#          green here proves a clean machine comes up, not that the team data travels.

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fresh-machine.yml"
      - "infrastructure/**"
      - "scripts/**"
      - "Makefile"
      - "docker-compose.yml"
      # a .dockerignore / bake change can break `make all`'s image builds outright
      # (an excluded COPY source fails the build) — so they gate this run too
      - ".dockerignore"
      - "docker-bake.hcl"
      - "apps/grobase"
      - "apps/opposite-osiris"
      - ".gitmodules"
      - "apps/graph_render"
  # PRs run only the bats job below (seconds, no secrets); clone-and-make-all is main-only.
  pull_request:
    paths:
      - ".github/workflows/fresh-machine.yml"
      - "infrastructure/**"
      - "scripts/**"
      - "Makefile"
      - "docker-compose.yml"
      - ".dockerignore"
      - "docker-bake.hcl"
      - "apps/grobase"
      - "apps/opposite-osiris"
      - ".gitmodules"
      - "apps/graph_render"
  workflow_dispatch:
    inputs:
      grobase_edition:
        description: "grobase backend edition (migrate|full|prod|query)"
        default: "migrate"
      skip_sync:
        description: "1 = the pinned/defense path: make all SKIP_SYNC=1 builds every submodule at its gitlink (as scripts/verify/fresh-bringup.sh does); 0 = sync to branch tips first"
        type: choice
        options: ["0", "1"]
        default: "0"

concurrency:
  group: fresh-machine-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # restore-if-empty decides whether `make all` replays the committed snapshot OVER the
  # running engines, and make-all-footprint pins what `make all` pulls and builds (a fresh
  # machine has a 20-30 GB /var). Both run against a fake docker — seconds, no secrets, no
  # stack — so a regression fails here before the two-hour run below. The footprint tests
  # drive the real Makefile (make + GNU timeout) and grobase's vault-restore.sh.
  restore-gate-tests:
    name: make all safety + footprint tests (bats)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: grobase + opposite-osiris checkout (vault-restore.sh and the web/gateway Dockerfiles are under test)
        run: |
          git config --global --add url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init --depth 1 apps/grobase apps/opposite-osiris
      - name: bats scripts/tests
        run: |
          docker run --rm -v "$PWD:/code" -w /code --entrypoint sh \
            bats/bats:1.11.1@sha256:e56e7c49087cb766b1ba9c5732b8f5402d289252d52f64e1eefb88269f74125c \
            -c 'apk add -q --no-cache make coreutils git && bats scripts/tests'

  clone-and-make-all:
    name: clone --recursive + make all
    needs: restore-gate-tests
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      VAULT42_KEYSTORE_B64: ${{ secrets.VAULT42_KEYSTORE_B64 }}
      VAULT42_CONTRACT_B64: ${{ secrets.VAULT42_CONTRACT_B64 }}
      VAULT42_SESSION_B64: ${{ secrets.VAULT42_SESSION_B64 }}
      VAULT42_PASSPHRASE: ${{ secrets.VAULT42_PASSPHRASE }}
      FT_PASSPHRASE: ${{ secrets.VAULT42_PASSPHRASE }}
      GROBASE_EDITION: ${{ github.event.inputs.grobase_edition || 'migrate' }}
      TRACK_BINOCLE_SKIP_CERT_TRUST: "1"
      COMPOSE_PROFILES: dev
      DOCKER_BUILDKIT: "1"
    steps:
      - name: Reclaim runner disk (a full stack pulls ~50 images + builds frontends)
        run: |
          echo "before:"; df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache \
                      /usr/local/share/boost /usr/local/share/powershell /usr/share/swift \
                      /usr/local/graalvm /usr/local/.ghcup || true
          sudo docker image prune -af >/dev/null 2>&1 || true
          echo "after:"; df -h / | tail -1

      - name: Preconditions — the vault secrets (only non-clone inputs), and the mode
        id: pre
        run: |
          [ -n "$VAULT42_KEYSTORE_B64" ] || { echo "::error::VAULT42_KEYSTORE_B64 secret is empty/unset"; exit 1; }
          [ -n "$VAULT42_PASSPHRASE" ]   || { echo "::error::VAULT42_PASSPHRASE secret is empty/unset"; exit 1; }
          [ -n "$VAULT42_CONTRACT_B64" ] || { echo "::error::VAULT42_CONTRACT_B64 secret is unset — set it once: base64 -w0 ~/.config/42ctl/contract-default.tok | gh secret set VAULT42_CONTRACT_B64 -R Univers42/groot"; exit 1; }
          if [ -n "$VAULT42_SESSION_B64" ]; then
            echo "mode=team" >> "$GITHUB_OUTPUT"
            echo "vault secrets present (keystore + contract + session + passphrase) — TEAM mode: pull + all-engine restore"
          else
            echo "mode=local" >> "$GITHUB_OUTPUT"
            echo "::warning title=no VAULT42_SESSION_B64 — LOCAL mode::make all runs with no vault identity: self-generated secrets, empty engines, demo account created locally. The vault pull and the data restore are NOT exercised by this run."
            echo "::notice title=to exercise the vault path::on a logged-in machine (42ctl auth status): base64 -w0 ~/.config/42ctl/session-default.tok | gh secret set VAULT42_SESSION_B64 -R Univers42/groot — and seal infra/S3_KEY / infra/S3_SECRET so seeds above 4 MiB (minio.tar.gz) can travel."
          fi

      # Order matters and used to be wrong: the rewrite that makes `git@github.com:` URLs
      # resolve without an SSH key was configured AFTER the recursive checkout that needs
      # it. Every .gitmodules in this tree — root, osionos/app, and notion-database-sys
      # three levels down — uses the SSH form, so the nested clones had nothing to rewrite
      # with. It also used two plain `git config` calls for the same key: insteadOf is
      # MULTI-VALUED, so the second silently REPLACED the first and only `ssh://git@…`
      # was ever rewritten — the `git@github.com:` form every submodule actually uses was
      # not. `--add` keeps both.
      - name: Rewrite SSH submodule URLs to public HTTPS (no SSH keys in CI)
        run: |
          git config --global --add url."https://github.com/".insteadOf "git@github.com:"
          git config --global --add url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global --get-all url."https://github.com/".insteadOf

      - name: git clone (root only — submodules are next, explicitly)
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # Explicit rather than `submodules: recursive` so a failure names the submodule that
      # failed instead of collapsing 20 nested clones into one red step with no detail.
      # This exact sequence was reproduced green against every repo in the tree over
      # anonymous HTTPS before being committed.
      - name: git submodule update --init --recursive (all 20, depth 1)
        run: |
          set -euo pipefail
          git submodule sync --recursive
          git submodule update --init --recursive --depth=1
          n=$(git submodule status --recursive | wc -l)
          echo "checked out ${n} submodule(s)"
          [ "$n" -ge 20 ] || { echo "::error::expected >=20 submodules, got ${n}"; exit 1; }
          git submodule status --recursive | sed 's/^/  /'

      - name: Place the vault identity (keystore + contract + session) — machine config
        if: steps.pre.outputs.mode == 'team'
        run: |
          d="$HOME/.config/42ctl"; mkdir -p "$d"
          echo "keystore secret: ${#VAULT42_KEYSTORE_B64} chars (≈664)   contract secret: ${#VAULT42_CONTRACT_B64} chars (≈244)"
          # Strip to the base64 alphabet first: tolerates a stray zsh '%', CR/LF, or paste
          # whitespace. Valid base64 is only [A-Za-z0-9+/=], so this is lossless for a good value.
          printf '%s' "$VAULT42_KEYSTORE_B64" | tr -cd 'A-Za-z0-9+/=' | base64 -d > "$d/keystore.v42" 2>/dev/null || {
            echo "::error::VAULT42_KEYSTORE_B64 is not decodable base64. Re-set: base64 -w0 ~/.config/42ctl/keystore.v42 | gh secret set VAULT42_KEYSTORE_B64 -R Univers42/groot"; exit 1; }
          n=$(wc -c < "$d/keystore.v42"); echo "decoded keystore bytes: $n (expect ~498)"
          [ "$n" -ge 200 ] || { echo "::error::keystore decoded to $n bytes — secret content is wrong"; exit 1; }
          chmod 600 "$d/keystore.v42"
          # The contract token carries the tenant (grobase-secrets); the vault denies without it.
          if [ -z "$VAULT42_CONTRACT_B64" ]; then
            echo "::error::VAULT42_CONTRACT_B64 is not set. The vault also needs the contract token. Set it once:"
            echo "::error::  base64 -w0 ~/.config/42ctl/contract-default.tok | gh secret set VAULT42_CONTRACT_B64 -R Univers42/groot"
            exit 1
          fi
          printf '%s' "$VAULT42_CONTRACT_B64" | tr -cd 'A-Za-z0-9+/=' | base64 -d > "$d/contract-default.tok" 2>/dev/null || {
            echo "::error::VAULT42_CONTRACT_B64 is not decodable base64"; exit 1; }
          c=$(wc -c < "$d/contract-default.tok"); echo "decoded contract bytes: $c (expect ~182)"
          [ "$c" -ge 50 ] || { echo "::error::contract decoded to $c bytes — secret content is wrong"; exit 1; }
          chmod 600 "$d/contract-default.tok"
          # The saved session is what `42ctl auth login` writes; the pull is refused without it.
          printf '%s' "$VAULT42_SESSION_B64" | tr -cd 'A-Za-z0-9+/=' | base64 -d > "$d/session-default.tok" 2>/dev/null || {
            echo "::error::VAULT42_SESSION_B64 is not decodable base64"; exit 1; }
          s=$(wc -c < "$d/session-default.tok"); echo "decoded session bytes: $s"
          [ "$s" -ge 20 ] || { echo "::error::session decoded to $s bytes — secret content is wrong"; exit 1; }
          chmod 600 "$d/session-default.tok"
          ls -la "$d"

      - name: "☄  make all   — provisions the whole machine from nothing"
        env:
          SKIP_SYNC_INPUT: ${{ github.event.inputs.skip_sync }}
          # team: a failed pull FAILS make all at once, named. Unset, make all would fall back
          # to LOCAL mode and this run would prove the wrong thing under the team label.
          VAULT42_SOURCE: ${{ steps.pre.outputs.mode == 'team' && 'team' || '' }}
        run: |
          case "${SKIP_SYNC_INPUT:-0}" in
            0|1) ;;
            *) echo "::error::skip_sync must be 0 or 1, got '${SKIP_SYNC_INPUT}'"; exit 1 ;;
          esac
          set -o pipefail
          make all SKIP_SYNC="${SKIP_SYNC_INPUT:-0}" 2>&1 | tee "$RUNNER_TEMP/make-all.log"

      # The job log needs a token to read; check-run annotations do not (the public API serves
      # them, and nothing on the dev box can read logs). So the tail of `make all` is emitted as
      # ::error annotations: 6 lines each, 10 per step is GitHub's cap, values after =
      # redacted in case a script ever echoes one.
      - name: Name the failure in annotations (readable without a token)
        if: failure()
        run: |
          test -s "$RUNNER_TEMP/make-all.log" || { echo "::error title=make all::no output captured"; exit 0; }
          tail -n 60 "$RUNNER_TEMP/make-all.log" \
            | sed -E 's/\x1b\[[0-9;]*m//g; s/([A-Z_]*(PASSWORD|SECRET|TOKEN|KEY|PASSPHRASE)[A-Z_]*=)[^ ]*/\1<redacted>/g' \
            | awk '{ buf = buf $0 "%0A"; n++ } n == 6 { printf "::error title=make all tail %d::%s\n", ++c, buf; buf = ""; n = 0 } END { if (n) printf "::error title=make all tail %d::%s\n", ++c, buf }'

      # The tail says where it died; these say which path got there — vault pull or LOCAL mode,
      # submodule sync, which restore source, demo-login. Same redaction, ::warning so they
      # read apart from the tail.
      - name: Name the path in annotations (secrets, sync, restore, demo-login markers)
        if: failure()
        run: |
          test -s "$RUNNER_TEMP/make-all.log" || exit 0
          { grep -E '^\[(secrets|make all|restore-if-empty|demo-login|gen-local-env|sync|submodules?)\]|vault42|LOCAL mode|42ctl|not found|No such file' "$RUNNER_TEMP/make-all.log" || true; } \
            | sed -E 's/\x1b\[[0-9;]*m//g; s/([A-Z_]*(PASSWORD|SECRET|TOKEN|KEY|PASSPHRASE)[A-Z_]*=)[^ ]*/\1<redacted>/g' \
            | head -n 60 \
            | awk '{ buf = buf $0 "%0A"; n++ } n == 6 { printf "::warning title=make all markers %d::%s\n", ++c, buf; buf = ""; n = 0 } END { if (n) printf "::warning title=make all markers %d::%s\n", ++c, buf }'

      - name: Prove the all-engine data restored (ASSERTS all 6 engines non-zero)
        if: success() && steps.pre.outputs.mode == 'team'
        run: |
          echo "== running engines =="
          docker ps --format '{{.Names}}' | grep -E 'mini-baas-(postgres|mysql|mongo|mssql|dynamodb|minio)' | sort
          fail=0
          gt0() { case "$1" in ''|*[!0-9]*) return 1 ;; 0) return 1 ;; *) return 0 ;; esac; }
          # 1 postgres (osionos pages)
          pgpw=$(docker exec mini-baas-postgres printenv POSTGRES_PASSWORD 2>/dev/null)
          pgc=$(docker exec -e PGPASSWORD="$pgpw" mini-baas-postgres psql -U postgres -d postgres -tAc "SELECT count(*) FROM osionos_pages" 2>/dev/null | tr -d '[:space:]')
          echo "postgres osionos_pages = ${pgc:-<none>}"; gt0 "$pgc" || { echo "::error::postgres osionos_pages empty"; fail=1; }
          # 2 mysql (ops schema)
          mypw=$(docker exec mini-baas-mysql printenv MYSQL_ROOT_PASSWORD 2>/dev/null)
          myc=$(docker exec mini-baas-mysql mysql -uroot -p"$mypw" -N -e "SELECT count(*) FROM information_schema.tables WHERE table_schema='ops'" 2>/dev/null | tr -d '[:space:]')
          echo "mysql ops tables = ${myc:-<none>}"; gt0 "$myc" || { echo "::error::mysql ops empty"; fail=1; }
          # 3 mongo (activity events)
          mu=$(docker exec mini-baas-mongo printenv MONGO_INITDB_ROOT_USERNAME 2>/dev/null); mp=$(docker exec mini-baas-mongo printenv MONGO_INITDB_ROOT_PASSWORD 2>/dev/null)
          moc=$(docker exec mini-baas-mongo mongosh --quiet -u "$mu" -p "$mp" --authenticationDatabase admin --eval 'db.getSiblingDB("activity").events.countDocuments()' 2>/dev/null | tr -d '[:space:]')
          echo "mongo activity.events = ${moc:-<none>}"; gt0 "$moc" || { echo "::error::mongo activity empty"; fail=1; }
          # 4 mssql (finance DB tables)
          msc=$(docker exec mini-baas-mssql sh -lc '/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$MSSQL_SA_PASSWORD" -h-1 -W -Q "SET NOCOUNT ON; SELECT COUNT(*) FROM finance.sys.tables"' 2>/dev/null | tr -d '[:space:]')
          echo "mssql finance tables = ${msc:-<none>}"; gt0 "$msc" || { echo "::error::mssql finance empty"; fail=1; }
          # 5 dynamodb (table count)
          ddc=$(docker run --rm --network mini-baas_mini-baas -e AWS_ACCESS_KEY_ID=local -e AWS_SECRET_ACCESS_KEY=local -e AWS_DEFAULT_REGION=us-east-1 amazon/aws-cli dynamodb list-tables --endpoint-url http://mini-baas-dynamodb-local:8000 --output text --query 'length(TableNames)' 2>/dev/null | tr -d '[:space:]')
          echo "dynamodb tables = ${ddc:-<none>}"; gt0 "$ddc" || { echo "::error::dynamodb empty"; fail=1; }
          # 6 minio (object count)
          mnc=$(docker exec mini-baas-minio sh -c 'find /data -type f -not -path "*/.minio.sys/*" 2>/dev/null | wc -l' 2>/dev/null | tr -d '[:space:]')
          echo "minio objects = ${mnc:-<none>}"; gt0 "$mnc" || { echo "::error::minio objects empty"; fail=1; }
          [ "$fail" = 0 ] && echo "✓ ALL 6 engines restored with data (postgres mysql mongo mssql dynamodb minio)" || exit 1

      # LOCAL mode has no data to prove; it proves the no-vault promise instead: the account
      # demo-login-ensure created exists, and its password grant passes through Kong. Keys and
      # password go through a curl config and stdin, never argv or the log.
      - name: Prove the no-vault stack (LOCAL mode) — demo account exists and logs in
        if: success() && steps.pre.outputs.mode == 'local'
        run: |
          set -euo pipefail
          . scripts/lib/demo-login.sh
          pw=$(demo_login_password .env.local)
          key=$(sed -n 's/^SB_KONG_KEY=//p' .env.local | tail -1)
          n=$(docker exec mini-baas-postgres psql -U postgres -d postgres -tAc "SELECT count(*) FROM auth.users WHERE email = '$DEMO_LOGIN_EMAIL'" | tr -d '[:space:]')
          echo "auth.users rows for $DEMO_LOGIN_EMAIL: $n"; [ "$n" = 1 ]
          port=$(docker port mini-baas-kong 8000/tcp | head -1 | sed 's/.*://')
          printf 'header = "apikey: %s"\nheader = "Content-Type: application/json"\n' "$key" > "$RUNNER_TEMP/grant.cfg"
          code=$(printf '{"email":"%s","password":"%s"}' "$DEMO_LOGIN_EMAIL" "$pw" \
            | curl -sS -K "$RUNNER_TEMP/grant.cfg" --data-binary @- -o /dev/null -w '%{http_code}' "http://127.0.0.1:$port/auth/v1/token?grant_type=password")
          echo "password grant through Kong → HTTP $code"; [ "$code" = 200 ]

      - name: Assert core/engine/app containers healthy (everything green)
        if: success()
        run: |
          # Vestigial services osionos does NOT use — unhealthy even on the reference dev box
          # (PostgREST + the supavisor pooler) or pure monitoring/lakehouse. Tolerated (shown,
          # not hidden); every CORE / engine / app / data container must be strictly healthy.
          TOLERATE='mini-baas-(postgrest|supavisor|loki|prometheus|grafana|promtail|trino|waf)'
          for t in $(seq 1 18); do
            bad=$(docker ps --format '{{.Names}}\t{{.Status}}' | grep -iE 'unhealthy|Restarting' | grep -vE "$TOLERATE" || true)
            badexit=$(docker ps -a --format '{{.Names}}\t{{.Status}}' | grep -iE 'Exited \([1-9]' | grep -vE "$TOLERATE" || true)
            if [ -z "$bad" ] && [ -z "$badexit" ]; then
              echo "✓ every core/engine/app/data container is healthy"
              tol=$(docker ps --format '{{.Names}}\t{{.Status}}' | grep -iE 'unhealthy|Restarting' | grep -E "$TOLERATE" || true)
              [ -n "$tol" ] && { echo "— tolerated (vestigial, unused by osionos, unhealthy on the dev box too):"; echo "$tol"; }
              docker ps -a --format '  {{.Names}}\t{{.Status}}' | sort
              exit 0
            fi
            echo "[$t/18] waiting 10s for: $(printf '%s %s' "$bad" "$badexit" | tr '\n' ' ' | sed 's/  */ /g')"
            sleep 10
          done
          echo "== final container state =="; docker ps -a --format '  {{.Names}}\t{{.Status}}' | sort
          echo "::error::core/engine/app containers still unhealthy after ~180s:"; printf '%s\n%s\n' "$bad" "$badexit"
          exit 1

      # Through the real local-https-proxy :3001 → osionos-app, not an isolated container: the
      # pinned graph_render pack must arrive byte-exact as application/wasm, a missing file must
      # 404, and the SPA's index.html must name the pack base. -k: the proxy's cert is from the
      # local CA, which TRACK_BINOCLE_SKIP_CERT_TRUST keeps out of the runner's trust store.
      - name: Prove the graph_render pack is served through the proxy (:3001)
        if: success()
        run: |
          set -euo pipefail
          pin=$(git ls-tree HEAD apps/graph_render | awk '$2 == "commit" { print $3 }')
          pack=$(sed -n 's/^ARG GRAPH_STUDIO_PACK=//p' infrastructure/docker/osionos/app.Dockerfile)
          base="https://localhost:3001/graph-studio/$pin"
          cid=$(docker create "$pack" none); docker cp "$cid:/pack/pack.json" "$RUNNER_TEMP/pack.json"; docker rm "$cid" >/dev/null
          want=$(sed -n 's/.*"graph_wasm.wasm": *{[^}]*"sha256": *"\([0-9a-f]\{64\}\)".*/\1/p' "$RUNNER_TEMP/pack.json")
          got=$(curl -sSk -o "$RUNNER_TEMP/w.wasm" -w '%{http_code} %{content_type}' "$base/graph_wasm.wasm")
          sha=$(sha256sum "$RUNNER_TEMP/w.wasm" | cut -d' ' -f1)
          echo "GET $base/graph_wasm.wasm → $got sha256=$sha (pack.json: $want)"
          [ "$got" = "200 application/wasm" ] && [ "${#want}" -eq 64 ] && [ "$sha" = "$want" ]
          miss=$(curl -sSk -o /dev/null -w '%{http_code}' "$base/nope.wasm")
          echo "GET $base/nope.wasm → $miss"; [ "$miss" = 404 ]
          meta=$(curl -sSk https://localhost:3001/ | grep -o '<meta name="graph-studio-base"[^>]*>')
          echo "index.html: $meta"; [ "$meta" = "<meta name=\"graph-studio-base\" content=\"/graph-studio/$pin/\" />" ]

      # osionos's second brain on the live stack is graph_render's element fed by the bridge: the
      # Home graph from the rail, ?home=graph and a stored variant; Enter on a page node opens it;
      # a second user never sees the first user's pages; an index.html without the pack's meta says
      # the graph is unavailable. tests/e2e/run.sh: the pinned Playwright image, --network host.
      - name: e2e GR2 — osionos's second brain is graph_render (Playwright, live stack)
        if: success()
        run: bash tests/e2e/run.sh specs/gr2-osionos-graph.spec.ts

      - name: Upload the e2e results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-test-results
          path: tests/e2e/test-results
          if-no-files-found: ignore

      # Only meaningful once the stack is up; a run that died before that has no container to
      # ask. The pg_restore replay of apps/grobase/data-snapshots is gone with the snapshot
      # (grobase de656694); the vault seeds are restored by vault-restore.sh, which logs itself.
      - name: Postgres restore diagnostics
        if: failure()
        run: |
          docker ps --format '{{.Names}}' | grep -qx mini-baas-postgres || { echo "mini-baas-postgres is not running — nothing to diagnose"; exit 0; }
          P="docker exec mini-baas-postgres psql -U postgres"
          echo "== databases =="; $P -tAc "SELECT datname FROM pg_database WHERE datistemplate=false" 2>&1
          echo "== public tables in postgres DB =="; $P -d postgres -tAc "SELECT count(*) FROM pg_tables WHERE schemaname='public'" 2>&1
          echo "== osionos_pages =="; $P -d postgres -tAc "SELECT to_regclass('public.osionos_pages')" 2>&1
          $P -d postgres -tAc "SELECT count(*) FROM osionos_pages" 2>&1 | head -1

      - name: Diagnostics on failure
        if: failure()
        run: |
          echo "== disk =="; df -h / | tail -1
          echo "== mem =="; free -h || true
          echo "== docker ps -a =="; docker ps -a 2>/dev/null || true
          echo "== non-running container logs =="
          for c in $(docker ps -a --format '{{.Names}}' | grep -E '^(mini-baas|track-binocle)-' || true); do
            st=$(docker inspect -f '{{.State.Status}}' "$c" 2>/dev/null || echo '?')
            case "$st" in running) : ;; *) echo "--- $c ($st) ---"; docker logs --tail 60 "$c" 2>&1 | tail -60 ;; esac
          done

      - name: Summary
        if: always()
        run: |
          {
            echo "## clone --recursive + make all"
            echo ""
            echo "Simulates your other Ubuntu machine: a clean runner + the vault key (one-time machine"
            echo "config), then \`git clone --recursive\` + \`make all\` — nothing else. Green here means a"
            echo "fresh machine reconstitutes the whole stack (code → secrets → backend → data → frontends)."
            echo ""
            echo "Mode: **${{ steps.pre.outputs.mode }}** — team = vault pull + all-engine restore proven; local = the no-vault path, pull and restore NOT exercised."
          } >> "$GITHUB_STEP_SUMMARY"

