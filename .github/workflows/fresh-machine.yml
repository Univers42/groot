name: Fresh-Machine Migration

# THE migration test, exactly as it must work on your other Ubuntu machine:
#   git clone --recursive   →   make all   →   everything is up.
# A clean ubuntu-latest runner IS the new machine. The only thing that is NOT in the
# clone — and cannot be, by zero-knowledge design — is the vault key, placed here from a
# secret the way you'd copy ~/.config/42ctl/keystore.v42 once (like installing Docker).
# `make all` then self-provisions: sync submodules → pull secrets from vault42 (no OTP) →
# start the grobase backend (all public-image engines) → restore the all-engine snapshot →
# build+start the frontends → healthcheck. If this is red, the project isn't good enough.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fresh-machine.yml'
      - 'infrastructure/**'
      - 'scripts/**'
      - 'Makefile'
      - 'docker-compose.yml'
      - 'apps/grobase'
  workflow_dispatch:
    inputs:
      grobase_edition:
        description: 'grobase backend edition (migrate|full|prod|query)'
        default: 'migrate'

concurrency:
  group: fresh-machine-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  clone-and-make-all:
    name: clone --recursive + make all
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      VAULT42_KEYSTORE_B64: ${{ secrets.VAULT42_KEYSTORE_B64 }}
      VAULT42_CONTRACT_B64: ${{ secrets.VAULT42_CONTRACT_B64 }}
      VAULT42_PASSPHRASE:   ${{ secrets.VAULT42_PASSPHRASE }}
      FT_PASSPHRASE:        ${{ secrets.VAULT42_PASSPHRASE }}
      GROBASE_EDITION:      ${{ github.event.inputs.grobase_edition || 'migrate' }}
      TRACK_BINOCLE_SKIP_CERT_TRUST: '1'
      COMPOSE_PROFILES: dev
      DOCKER_BUILDKIT: '1'
    steps:
      - name: Reclaim runner disk (a full stack pulls ~50 images + builds frontends)
        run: |
          echo "before:"; df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache \
                      /usr/local/share/boost /usr/local/share/powershell /usr/share/swift \
                      /usr/local/graalvm /usr/local/.ghcup || true
          sudo docker image prune -af >/dev/null 2>&1 || true
          echo "after:"; df -h / | tail -1

      - name: Preconditions — the vault secrets (only non-clone inputs)
        run: |
          [ -n "$VAULT42_KEYSTORE_B64" ] || { echo "::error::VAULT42_KEYSTORE_B64 secret is empty/unset"; exit 1; }
          [ -n "$VAULT42_PASSPHRASE" ]   || { echo "::error::VAULT42_PASSPHRASE secret is empty/unset"; exit 1; }
          [ -n "$VAULT42_CONTRACT_B64" ] || { echo "::error::VAULT42_CONTRACT_B64 secret is unset — set it once: base64 -w0 ~/.config/42ctl/contract-default.tok | gh secret set VAULT42_CONTRACT_B64 -R Univers42/groot"; exit 1; }
          echo "vault secrets present (keystore + contract + passphrase)"

      - name: git clone --recursive (root + all submodules at latest)
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Submodule sync over public HTTPS (no SSH keys in CI)
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"

      - name: Place the vault identity (keystore + contract) — machine config
        run: |
          d="$HOME/.config/42ctl"; mkdir -p "$d"
          echo "keystore secret: ${#VAULT42_KEYSTORE_B64} chars (≈664)   contract secret: ${#VAULT42_CONTRACT_B64} chars (≈244)"
          # Strip to the base64 alphabet first: tolerates a stray zsh '%', CR/LF, or paste
          # whitespace. Valid base64 is only [A-Za-z0-9+/=], so this is lossless for a good value.
          printf '%s' "$VAULT42_KEYSTORE_B64" | tr -cd 'A-Za-z0-9+/=' | base64 -d > "$d/keystore.v42" 2>/dev/null || {
            echo "::error::VAULT42_KEYSTORE_B64 is not decodable base64. Re-set: base64 -w0 ~/.config/42ctl/keystore.v42 | gh secret set VAULT42_KEYSTORE_B64 -R Univers42/groot"; exit 1; }
          n=$(wc -c < "$d/keystore.v42"); echo "decoded keystore bytes: $n (expect ~498)"
          [ "$n" -ge 200 ] || { echo "::error::keystore decoded to $n bytes — secret content is wrong"; exit 1; }
          chmod 600 "$d/keystore.v42"
          # The contract token carries the tenant (grobase-secrets); the vault denies without it.
          if [ -z "$VAULT42_CONTRACT_B64" ]; then
            echo "::error::VAULT42_CONTRACT_B64 is not set. The vault also needs the contract token. Set it once:"
            echo "::error::  base64 -w0 ~/.config/42ctl/contract-default.tok | gh secret set VAULT42_CONTRACT_B64 -R Univers42/groot"
            exit 1
          fi
          printf '%s' "$VAULT42_CONTRACT_B64" | tr -cd 'A-Za-z0-9+/=' | base64 -d > "$d/contract-default.tok" 2>/dev/null || {
            echo "::error::VAULT42_CONTRACT_B64 is not decodable base64"; exit 1; }
          c=$(wc -c < "$d/contract-default.tok"); echo "decoded contract bytes: $c (expect ~182)"
          [ "$c" -ge 50 ] || { echo "::error::contract decoded to $c bytes — secret content is wrong"; exit 1; }
          chmod 600 "$d/contract-default.tok"
          ls -la "$d"

      - name: "☄  make all   — provisions the whole machine from nothing"
        run: make all

      - name: Prove the all-engine data restored (ASSERTS all 6 engines non-zero)
        if: success()
        run: |
          echo "== running engines =="
          docker ps --format '{{.Names}}' | grep -E 'mini-baas-(postgres|mysql|mongo|mssql|dynamodb|minio)' | sort
          fail=0
          gt0() { case "$1" in ''|*[!0-9]*) return 1 ;; 0) return 1 ;; *) return 0 ;; esac; }
          # 1 postgres (osionos pages)
          pgpw=$(docker exec mini-baas-postgres printenv POSTGRES_PASSWORD 2>/dev/null)
          pgc=$(docker exec -e PGPASSWORD="$pgpw" mini-baas-postgres psql -U postgres -d postgres -tAc "SELECT count(*) FROM osionos_pages" 2>/dev/null | tr -d '[:space:]')
          echo "postgres osionos_pages = ${pgc:-<none>}"; gt0 "$pgc" || { echo "::error::postgres osionos_pages empty"; fail=1; }
          # 2 mysql (ops schema)
          mypw=$(docker exec mini-baas-mysql printenv MYSQL_ROOT_PASSWORD 2>/dev/null)
          myc=$(docker exec mini-baas-mysql mysql -uroot -p"$mypw" -N -e "SELECT count(*) FROM information_schema.tables WHERE table_schema='ops'" 2>/dev/null | tr -d '[:space:]')
          echo "mysql ops tables = ${myc:-<none>}"; gt0 "$myc" || { echo "::error::mysql ops empty"; fail=1; }
          # 3 mongo (activity events)
          mu=$(docker exec mini-baas-mongo printenv MONGO_INITDB_ROOT_USERNAME 2>/dev/null); mp=$(docker exec mini-baas-mongo printenv MONGO_INITDB_ROOT_PASSWORD 2>/dev/null)
          moc=$(docker exec mini-baas-mongo mongosh --quiet -u "$mu" -p "$mp" --authenticationDatabase admin --eval 'db.getSiblingDB("activity").events.countDocuments()' 2>/dev/null | tr -d '[:space:]')
          echo "mongo activity.events = ${moc:-<none>}"; gt0 "$moc" || { echo "::error::mongo activity empty"; fail=1; }
          # 4 mssql (finance DB tables)
          msc=$(docker exec mini-baas-mssql sh -lc '/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$MSSQL_SA_PASSWORD" -h-1 -W -Q "SET NOCOUNT ON; SELECT COUNT(*) FROM finance.sys.tables"' 2>/dev/null | tr -d '[:space:]')
          echo "mssql finance tables = ${msc:-<none>}"; gt0 "$msc" || { echo "::error::mssql finance empty"; fail=1; }
          # 5 dynamodb (table count)
          ddc=$(docker run --rm --network mini-baas_mini-baas -e AWS_ACCESS_KEY_ID=local -e AWS_SECRET_ACCESS_KEY=local -e AWS_DEFAULT_REGION=us-east-1 amazon/aws-cli dynamodb list-tables --endpoint-url http://mini-baas-dynamodb-local:8000 --output text --query 'length(TableNames)' 2>/dev/null | tr -d '[:space:]')
          echo "dynamodb tables = ${ddc:-<none>}"; gt0 "$ddc" || { echo "::error::dynamodb empty"; fail=1; }
          # 6 minio (object count)
          mnc=$(docker exec mini-baas-minio sh -c 'find /data -type f -not -path "*/.minio.sys/*" 2>/dev/null | wc -l' 2>/dev/null | tr -d '[:space:]')
          echo "minio objects = ${mnc:-<none>}"; gt0 "$mnc" || { echo "::error::minio objects empty"; fail=1; }
          [ "$fail" = 0 ] && echo "✓ ALL 6 engines restored with data (postgres mysql mongo mssql dynamodb minio)" || exit 1

      - name: Assert core/engine/app containers healthy (everything green)
        if: success()
        run: |
          # Vestigial services osionos does NOT use — unhealthy even on the reference dev box
          # (PostgREST + the supavisor pooler) or pure monitoring/lakehouse. Tolerated (shown,
          # not hidden); every CORE / engine / app / data container must be strictly healthy.
          TOLERATE='mini-baas-(postgrest|supavisor|loki|prometheus|grafana|promtail|trino|waf)'
          for t in $(seq 1 18); do
            bad=$(docker ps --format '{{.Names}}\t{{.Status}}' | grep -iE 'unhealthy|Restarting' | grep -vE "$TOLERATE" || true)
            badexit=$(docker ps -a --format '{{.Names}}\t{{.Status}}' | grep -iE 'Exited \([1-9]' | grep -vE "$TOLERATE" || true)
            if [ -z "$bad" ] && [ -z "$badexit" ]; then
              echo "✓ every core/engine/app/data container is healthy"
              tol=$(docker ps --format '{{.Names}}\t{{.Status}}' | grep -iE 'unhealthy|Restarting' | grep -E "$TOLERATE" || true)
              [ -n "$tol" ] && { echo "— tolerated (vestigial, unused by osionos, unhealthy on the dev box too):"; echo "$tol"; }
              docker ps -a --format '  {{.Names}}\t{{.Status}}' | sort
              exit 0
            fi
            echo "[$t/18] waiting 10s for: $(printf '%s %s' "$bad" "$badexit" | tr '\n' ' ' | sed 's/  */ /g')"
            sleep 10
          done
          echo "== final container state =="; docker ps -a --format '  {{.Names}}\t{{.Status}}' | sort
          echo "::error::core/engine/app containers still unhealthy after ~180s:"; printf '%s\n%s\n' "$bad" "$badexit"
          exit 1

      - name: Postgres restore diagnostics
        if: failure()
        run: |
          P="docker exec mini-baas-postgres psql -U postgres"
          echo "== databases =="; $P -tAc "SELECT datname FROM pg_database WHERE datistemplate=false" 2>&1
          echo "== public tables in postgres DB =="; $P -d postgres -tAc "SELECT count(*) FROM pg_tables WHERE schemaname='public'" 2>&1
          echo "== osionos_pages now? =="; $P -d postgres -tAc "SELECT to_regclass('public.osionos_pages')" 2>&1
          echo "== commerce DB present (other postgres dump)? =="; $P -tAc "SELECT count(*) FROM pg_database WHERE datname='commerce'" 2>&1
          echo "== RE-RUN db-postgres.dump restore, show errors =="
          docker exec -i mini-baas-postgres pg_restore -U postgres --clean --if-exists --no-owner --no-privileges -d postgres \
            < apps/grobase/data-snapshots/archives/postgres/db-postgres.dump 2>&1 | grep -iE 'error|fatal|denied|does not exist|cannot|permission' | head -25
          echo "== osionos_pages + count after re-run =="; $P -d postgres -tAc "SELECT to_regclass('public.osionos_pages')" 2>&1
          $P -d postgres -tAc "SELECT count(*) FROM osionos_pages" 2>&1 | head -1

      - name: Diagnostics on failure
        if: failure()
        run: |
          echo "== disk =="; df -h / | tail -1
          echo "== mem =="; free -h || true
          echo "== docker ps -a =="; docker ps -a 2>/dev/null || true
          echo "== non-running container logs =="
          for c in $(docker ps -a --format '{{.Names}}' | grep -E '^(mini-baas|track-binocle)-' || true); do
            st=$(docker inspect -f '{{.State.Status}}' "$c" 2>/dev/null || echo '?')
            case "$st" in running) : ;; *) echo "--- $c ($st) ---"; docker logs --tail 60 "$c" 2>&1 | tail -60 ;; esac
          done

      - name: Summary
        if: always()
        run: |
          {
            echo "## clone --recursive + make all"
            echo ""
            echo "Simulates your other Ubuntu machine: a clean runner + the vault key (one-time machine"
            echo "config), then \`git clone --recursive\` + \`make all\` — nothing else. Green here means a"
            echo "fresh machine reconstitutes the whole stack (code → secrets → backend → data → frontends)."
          } >> "$GITHUB_STEP_SUMMARY"

# rerun: secrets complete (keystore+contract+passphrase)
