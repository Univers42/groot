name: Fresh-Machine Migration

# THE migration test, exactly as it must work on your other Ubuntu machine:
#   git clone --recursive   →   make all   →   everything is up.
# A clean ubuntu-latest runner IS the new machine. The only thing that is NOT in the
# clone — and cannot be, by zero-knowledge design — is the vault key, placed here from a
# secret the way you'd copy ~/.config/42ctl/keystore.v42 once (like installing Docker).
# `make all` then self-provisions: sync submodules → pull secrets from vault42 (no OTP) →
# start the grobase backend (all public-image engines) → restore the all-engine snapshot →
# build+start the frontends → healthcheck. If this is red, the project isn't good enough.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fresh-machine.yml'
      - 'infrastructure/**'
      - 'scripts/**'
      - 'Makefile'
      - 'docker-compose.yml'
      - 'apps/grobase'
  workflow_dispatch:
    inputs:
      grobase_edition:
        description: 'grobase backend edition (full|prod|query)'
        default: 'full'

concurrency:
  group: fresh-machine-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  clone-and-make-all:
    name: clone --recursive + make all
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      VAULT42_KEYSTORE_B64: ${{ secrets.VAULT42_KEYSTORE_B64 }}
      VAULT42_PASSPHRASE:   ${{ secrets.VAULT42_PASSPHRASE }}
      FT_PASSPHRASE:        ${{ secrets.VAULT42_PASSPHRASE }}
      GROBASE_EDITION:      ${{ github.event.inputs.grobase_edition || 'full' }}
      TRACK_BINOCLE_SKIP_CERT_TRUST: '1'
      COMPOSE_PROFILES: dev
      DOCKER_BUILDKIT: '1'
    steps:
      - name: Reclaim runner disk (a full stack pulls ~50 images + builds frontends)
        run: |
          echo "before:"; df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache \
                      /usr/local/share/boost /usr/local/share/powershell /usr/share/swift \
                      /usr/local/graalvm /usr/local/.ghcup || true
          sudo docker image prune -af >/dev/null 2>&1 || true
          echo "after:"; df -h / | tail -1

      - name: Preconditions — the two secrets (only non-clone inputs)
        run: |
          [ -n "$VAULT42_KEYSTORE_B64" ] || { echo "::error::VAULT42_KEYSTORE_B64 secret is empty/unset"; exit 1; }
          [ -n "$VAULT42_PASSPHRASE" ]   || { echo "::error::VAULT42_PASSPHRASE secret is empty/unset"; exit 1; }
          echo "both vault secrets present"

      - name: git clone --recursive (root + all submodules at latest)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Submodule sync over public HTTPS (no SSH keys in CI)
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"

      - name: Place the vault key (machine config, like installing Docker)
        run: |
          mkdir -p "$HOME/.config/42ctl"
          printf '%s' "$VAULT42_KEYSTORE_B64" | base64 -d > "$HOME/.config/42ctl/keystore.v42"
          chmod 600 "$HOME/.config/42ctl/keystore.v42"
          echo "keystore bytes: $(wc -c < "$HOME/.config/42ctl/keystore.v42") (expect ~498)"

      - name: "☄  make all   — provisions the whole machine from nothing"
        run: make all

      - name: Prove the all-engine data restored (per-engine row counts)
        if: success()
        run: |
          set +e
          echo "== running engines =="
          docker ps --format '{{.Names}}' | grep -E 'mini-baas-(postgres|mysql|mongo|mssql|dynamodb|minio)' | sort
          echo "== postgres =="
          docker exec mini-baas-postgres psql -U postgres -d postgres -tAc \
            "SELECT 'osionos_pages='||count(*) FROM osionos_pages" 2>/dev/null
          echo "== mysql =="
          pw=$(docker exec mini-baas-mysql printenv MYSQL_ROOT_PASSWORD 2>/dev/null)
          docker exec mini-baas-mysql mysql -uroot -p"$pw" -N -e \
            "SELECT CONCAT('ops_tables=',count(*)) FROM information_schema.tables WHERE table_schema='ops'" 2>/dev/null
          echo "== mongo =="
          mu=$(docker exec mini-baas-mongo printenv MONGO_INITDB_ROOT_USERNAME 2>/dev/null)
          mp=$(docker exec mini-baas-mongo printenv MONGO_INITDB_ROOT_PASSWORD 2>/dev/null)
          docker exec mini-baas-mongo mongosh --quiet -u "$mu" -p "$mp" --authenticationDatabase admin \
            --eval 'print("activity_events="+db.getSiblingDB("activity").events.countDocuments())' 2>/dev/null
          echo "(dynamodb is a hypertube-vendor engine with private images — out of the CI shape by design)"

      - name: Diagnostics on failure
        if: failure()
        run: |
          echo "== disk =="; df -h / | tail -1
          echo "== mem =="; free -h || true
          echo "== docker ps -a =="; docker ps -a 2>/dev/null || true
          echo "== non-running container logs =="
          for c in $(docker ps -a --format '{{.Names}}' | grep -E '^(mini-baas|track-binocle)-' || true); do
            st=$(docker inspect -f '{{.State.Status}}' "$c" 2>/dev/null || echo '?')
            case "$st" in running) : ;; *) echo "--- $c ($st) ---"; docker logs --tail 60 "$c" 2>&1 | tail -60 ;; esac
          done

      - name: Summary
        if: always()
        run: |
          {
            echo "## clone --recursive + make all"
            echo ""
            echo "Simulates your other Ubuntu machine: a clean runner + the vault key (one-time machine"
            echo "config), then \`git clone --recursive\` + \`make all\` — nothing else. Green here means a"
            echo "fresh machine reconstitutes the whole stack (code → secrets → backend → data → frontends)."
          } >> "$GITHUB_STEP_SUMMARY"
