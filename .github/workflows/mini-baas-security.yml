# File: .github/workflows/mini-baas-security.yml
# Security gatekeeper — runs SAST, SCA, container scan, secret scan, and
# DAST against the mini-baas backend on every PR and main push.

name: mini-baas security

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_dast:
        description: "Also run the heavy DAST/ZAP scan (stands up the full grobase backend)"
        type: boolean
        default: false

concurrency:
  group: mini-baas-security-${{ github.ref }}
  cancel-in-progress: true

env:
  COMPOSE_BAKE: "true"
  DOCKER_BUILDKIT: "1"

jobs:
  # ── 1. SAST — Semgrep ──────────────────────────────────────────────────────
  sast-semgrep:
    name: SAST · Semgrep
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}
          fetch-depth: 0
      - name: Check out submodules (non-recursive)
        env:
          GH_TOKEN: ${{ secrets.SUBMODULES_TOKEN || github.token }}
        run: |
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "git@github.com:"
          git submodule update --init apps/grobase apps/opposite-osiris apps/calendar apps/mail apps/osionos/app

      - name: Run Semgrep (community rules) -> SARIF
        continue-on-error: true
        run: |
          docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep:latest \
            semgrep scan \
              --config p/owasp-top-ten --config p/typescript --config p/dockerfile \
              --config p/nodejs --config p/javascript \
              --sarif --output /src/semgrep.sarif || true
          # Guarantee a valid SARIF so the upload step never hard-fails this advisory job.
          [ -s semgrep.sarif ] || printf '%s' '{"version":"2.1.0","$schema":"https://json.schemastore.org/sarif-2.1.0.json","runs":[]}' > semgrep.sarif

      - name: Upload SARIF to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  # ── 2. SCA — npm + pnpm audit ──────────────────────────────────────────────
  sca-npm-audit:
    name: SCA · npm + pnpm audit (${{ matrix.dir }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          # Scope: BaaS/grobase only. Frontend app deps are covered by the
          # Supply Chain workflow (frozen installs) + their own repos' CI.
          - dir: apps/grobase/src
            tool: npm
          - dir: apps/grobase/sdks/js
            tool: npm
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}
      - name: Check out submodules (non-recursive)
        env:
          GH_TOKEN: ${{ secrets.SUBMODULES_TOKEN || github.token }}
        run: |
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "git@github.com:"
          git submodule update --init apps/grobase apps/opposite-osiris apps/calendar apps/mail apps/osionos/app

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable corepack for pnpm
        if: matrix.tool == 'pnpm'
        run: corepack enable && corepack prepare pnpm@10.32.1 --activate

      - name: Audit (${{ matrix.tool }})
        run: |
          cd "${{ matrix.dir }}"
          if [[ "${{ matrix.tool }}" == "pnpm" ]]; then
            pnpm audit --prod --audit-level=high
          else
            npm audit --audit-level=high --no-fund
          fi

  # ── 3. SCA — Snyk (gated on token) ─────────────────────────────────────────
  sca-snyk:
    name: SCA · Snyk
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    if: ${{ github.event_name == 'pull_request' }}
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}
      - name: Check out submodules (non-recursive)
        env:
          GH_TOKEN: ${{ secrets.SUBMODULES_TOKEN || github.token }}
        run: |
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "git@github.com:"
          git submodule update --init apps/grobase apps/opposite-osiris apps/calendar apps/mail apps/osionos/app

      - name: Skip if no token
        if: env.SNYK_TOKEN == ''
        run: echo "::notice::SNYK_TOKEN not configured — skipping Snyk"

      - uses: snyk/actions/setup@master
        if: env.SNYK_TOKEN != ''

      - name: Snyk test
        if: env.SNYK_TOKEN != ''
        run: snyk test --all-projects --severity-threshold=high
        continue-on-error: true

  # ── 4. Container — Trivy ───────────────────────────────────────────────────
  container-trivy:
    name: Container · Trivy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}
      - name: Check out submodules (non-recursive)
        env:
          GH_TOKEN: ${{ secrets.SUBMODULES_TOKEN || github.token }}
        run: |
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "git@github.com:"
          git submodule update --init apps/grobase apps/opposite-osiris apps/calendar apps/mail apps/osionos/app

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: sarif
          output: trivy-fs.sarif
          # Scope the fs scan to root-repo-owned production code. Excluded:
          # build artifacts (node_modules/dist/build/coverage/...); third-party vendored
          # trees (**/vendor — the bare `vendor` missed nested apps/grobase/vendor);
          # generated docusaurus (**/static_docs, **/.docusaurus); the dead pre-extraction
          # backup (apps/baas.bak, also deleted); and the independent submodules/nested
          # repos whose dependencies are gated elsewhere — the frontend apps by their own
          # repos' CI + the Supply Chain workflow, and apps/grobase by THIS workflow's
          # dedicated cargo-audit / govulncheck / npm-audit jobs.
          skip-dirs: "node_modules,**/node_modules,dist,**/dist,build,**/build,.git,coverage,playwright-report,vendor,**/vendor,**/static_docs,**/.docusaurus,apps/baas.bak,apps/osionos/app,apps/opposite-osiris,apps/mail,apps/calendar,apps/grobase,apps/vite-gourmand"

      - name: Upload Trivy filesystem SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

      - name: Build a representative BaaS image
        id: build_img
        continue-on-error: true
        run: |
          for i in 1 2 3; do
            echo "::group::docker build (attempt $i/3)"
            DOCKER_BUILDKIT=1 docker build --build-arg APP=query-router -t mini-baas/query-router:ci apps/grobase/src \
              && { echo "::endgroup::"; exit 0; }
            echo "::endgroup::"
            echo "build attempt $i failed (transient Docker Hub timeout?) — retry in $((i * 20))s"
            sleep $((i * 20))
          done
          echo "::warning::representative image build failed after 3 retries (registry flake) — skipping the supplementary image scan; the Trivy filesystem scan already covered dependencies"
          exit 1

      # The image build/scan is SUPPLEMENTARY (the fs scan above is the primary SCA). Only run it
      # when the build actually succeeded, so a Docker Hub outage can't red the security gate.
      - name: Trivy image scan
        if: steps.build_img.outcome == 'success'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: mini-baas/query-router:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: sarif
          output: trivy-image.sarif

      - name: Upload Trivy image SARIF
        if: steps.build_img.outcome == 'success'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

  # ── 5. Secret — TruffleHog ─────────────────────────────────────────────────
  secret-trufflehog:
    name: Secret · TruffleHog
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}
          fetch-depth: 0
      - name: Check out submodules (non-recursive)
        env:
          GH_TOKEN: ${{ secrets.SUBMODULES_TOKEN || github.token }}
        run: |
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "git@github.com:"
          git submodule update --init apps/grobase apps/opposite-osiris apps/calendar apps/mail apps/osionos/app

      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha || github.event.before }}
          head: ${{ github.event.pull_request.head.sha || github.sha }}
          extra_args: --only-verified

  # ── 5b. Secret — gitleaks (working-tree regex/entropy, blocking) ───────────
  secret-gitleaks:
    name: Secret · gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}
      - name: Check out submodules (non-recursive)
        env:
          GH_TOKEN: ${{ secrets.SUBMODULES_TOKEN || github.token }}
        run: |
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "git@github.com:"
          git submodule update --init apps/grobase apps/opposite-osiris apps/calendar apps/mail apps/osionos/app

      - name: Install gitleaks
        run: |
          set -euo pipefail
          VER=8.21.2
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: gitleaks detect (baas working tree, blocking)
        run: |
          gitleaks detect --no-git \
            --source apps/grobase \
            --config apps/grobase/.gitleaks.toml \
            --redact --no-banner --exit-code 1 \
            --report-format sarif --report-path gitleaks.sarif

      - name: Upload gitleaks SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks

  # ── 5c. SCA — cargo-audit (Rust workspaces, blocking) ──────────────────────
  sca-cargo-audit:
    name: SCA · cargo-audit (${{ matrix.ws }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        ws:
          - apps/grobase/src/data-plane-router
          - apps/grobase/infra/docker/services/realtime/realtime-agnostic
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}
      - name: Check out submodules (non-recursive)
        env:
          GH_TOKEN: ${{ secrets.SUBMODULES_TOKEN || github.token }}
        run: |
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "git@github.com:"
          git submodule update --init apps/grobase apps/opposite-osiris apps/calendar apps/mail apps/osionos/app

      - name: Install cargo-audit
        run: |
          set -euo pipefail
          if cargo audit --version >/dev/null 2>&1; then cargo audit --version; exit 0; fi
          for i in 1 2 3; do
            echo "::group::cargo install cargo-audit (attempt $i/3)"
            cargo install cargo-audit --locked && { echo "::endgroup::"; break; }
            echo "::endgroup::"
            echo "attempt $i failed (transient crates.io/network?) — retrying in $((i*20))s"
            sleep $((i * 20))
          done
          cargo audit --version

      - name: cargo audit (blocking)
        run: |
          set -euo pipefail
          # The 3 rustls-webpki advisories arrive solely via tiberius 0.12.3
          # (MSSQL adapter, its rustls 0.21 chain); 0.12.3 IS the latest release
          # and no upstream fix exists yet — they are reachable only for EXTERNAL
          # TLS mssql mounts. They are --ignored (mirroring scripts/security/
          # audit-deps.sh and wiki/security-audit.md's accepted-with-remediation
          # posture) so a NEW advisory still fails the gate. Remediation: drop the
          # --ignore flags when a rustls-0.2x tiberius release lands.
          cd "${{ matrix.ws }}"
          cargo audit \
            --ignore RUSTSEC-2026-0098 \
            --ignore RUSTSEC-2026-0099 \
            --ignore RUSTSEC-2026-0104

  # ── 5d. SCA — govulncheck (Go control plane, blocking) ─────────────────────
  sca-govulncheck:
    name: SCA · govulncheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}
      - name: Check out submodules (non-recursive)
        env:
          GH_TOKEN: ${{ secrets.SUBMODULES_TOKEN || github.token }}
        run: |
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "git@github.com:"
          git submodule update --init apps/grobase apps/opposite-osiris apps/calendar apps/mail apps/osionos/app

      - uses: actions/setup-go@v5
        with:
          # Minor-version floor + check-latest so this always resolves to the
          # newest 1.25.x patch (never re-pinned to a stale cached patch like
          # go1.25.11, which shipped GO-2026-5856 — fixed in go1.25.12).
          go-version: "1.25"
          check-latest: true
          cache-dependency-path: apps/grobase/src/control-plane/go.sum

      - name: Install govulncheck
        run: |
          set -euo pipefail
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" -version

      - name: govulncheck (reachability-based, blocking)
        run: |
          set -euo pipefail
          cd apps/grobase/src/control-plane
          "$(go env GOPATH)/bin/govulncheck" ./...

  # ── 6. DAST — ZAP baseline on main only (heavy) ────────────────────────────
  dast-zap:
    name: DAST · ZAP baseline
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    needs: [sast-semgrep, sca-npm-audit, container-trivy, secret-trufflehog]
    # Opt-in only: stands up the full grobase stack (heavy, needs the backend), so it
    # never gates push/PR and is skipped on ordinary dispatches. Run it via
    # "Run workflow" with run_dast=true.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_dast }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}
      - name: Check out submodules (non-recursive)
        env:
          GH_TOKEN: ${{ secrets.SUBMODULES_TOKEN || github.token }}
        run: |
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "git@github.com:"
          git submodule update --init apps/grobase apps/opposite-osiris apps/calendar apps/mail apps/osionos/app

      - name: Bring the baas stack up (safe ports)
        env:
          BAAS_VERIFY_SAFE_PORTS: "1"
          BAAS_VERIFY_NO_WAF: "0"
        run: |
          set -e
          : > apps/grobase/.env
          {
            echo "POSTGRES_USER=postgres"
            echo "POSTGRES_PASSWORD=postgres"
            echo "POSTGRES_DB=postgres"
            echo "JWT_SECRET=ci-jwt-secret-min-32-chars-long-xx"
            echo "KONG_CORS_ORIGIN_APP=https://localhost:3000"
            echo "KONG_CORS_ORIGIN_FRONTEND=https://localhost:4322"
            echo "KONG_CORS_ORIGIN_PLAYGROUND=https://localhost:3100"
            echo "KONG_CORS_ORIGIN_STUDIO=https://localhost:3001"
            echo "ADAPTER_REGISTRY_SERVICE_TOKEN=ci-adapter-token"
          } >> apps/grobase/.env
          bash apps/grobase/scripts/certs/generate-localhost-cert.sh >/dev/null
          BAAS_VERIFY_SAFE_PORTS=1 make -C apps/grobase up

      - name: ZAP baseline DAST
        env:
          WAF_HTTPS_PORT: "18443"
        run: |
          bash apps/grobase/scripts/verify/zap-baseline.sh \
            "https://127.0.0.1:18443"

      - name: Upload ZAP artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-baseline
          path: apps/grobase/artifacts/security/zap-baseline.*

      - name: Tear stack down
        if: always()
        run: make -C apps/grobase down || true

  # ── 7. Summary gate ────────────────────────────────────────────────────────
  security-gate:
    name: Security gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs:
      [
        sast-semgrep,
        sca-npm-audit,
        container-trivy,
        secret-trufflehog,
        secret-gitleaks,
        sca-cargo-audit,
        sca-govulncheck,
      ]
    if: always()
    steps:
      - name: Aggregate verdict
        run: |
          set -e
          fail=0
          for need in "${{ needs.sast-semgrep.result }}" \
                     "${{ needs.sca-npm-audit.result }}" \
                     "${{ needs.container-trivy.result }}" \
                     "${{ needs.secret-trufflehog.result }}" \
                     "${{ needs.secret-gitleaks.result }}" \
                     "${{ needs.sca-cargo-audit.result }}" \
                     "${{ needs.sca-govulncheck.result }}"; do
            if [[ "${need}" != "success" && "${need}" != "skipped" ]]; then
              fail=1
            fi
          done
          if [[ ${fail} -eq 1 ]]; then
            echo "::error::Security gate FAILED — see individual job logs"
            exit 1
          fi
          echo "Security gate OK"
