# BaaS CI — fast pre-merge checks for the grobase backend.
#
# grobase is now a SEPARATE repo (Univers42/grobase), tracked here as the
# `apps/grobase` submodule. Its own CI (that repo's .github/workflows/ci.yml) runs
# the exhaustive image-build + integration + enterprise battery. THIS workflow is
# the lean superproject gate: it checks out the pinned grobase commit and proves
# the Go control-plane and the two Rust planes compile + unit-test, plus validates
# static config. Toolchains run in containers (Docker-first) so no host setup drifts.
name: BaaS CI

on:
  pull_request:
    paths:
      - "apps/grobase"
      - ".github/workflows/baas-ci.yml"
  push:
    branches: ["main", "feat/**", "fix/**", "chore/**"]
    paths:
      - "apps/grobase"
      - ".github/workflows/baas-ci.yml"
  workflow_dispatch:

concurrency:
  group: baas-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go control-plane (vet + test)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}
      - name: Check out grobase submodule
        env:
          GH_TOKEN: ${{ secrets.SUBMODULES_TOKEN || github.token }}
        run: |
          git config url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "git@github.com:"
          git submodule update --init apps/grobase
      - name: vet + test (containerised toolchain)
        run: |
          docker run --rm -v "$PWD/apps/grobase/src/control-plane:/src" -w /src \
            golang:1.25-bookworm sh -c "go vet ./... && go test ./..."

  rust-data-plane:
    name: Rust data-plane (test)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}
      - name: Check out grobase submodule
        env:
          GH_TOKEN: ${{ secrets.SUBMODULES_TOKEN || github.token }}
        run: |
          git config url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "git@github.com:"
          git submodule update --init apps/grobase
      - name: cargo test --workspace
        run: |
          docker run --rm -e CARGO_NET_RETRY=10 -e CARGO_HTTP_MULTIPLEXING=false \
            -v "$PWD/apps/grobase/src/data-plane-router:/src" -w /src \
            rust:1-bookworm cargo test --workspace

  rust-realtime:
    name: Rust realtime (test)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}
      - name: Check out grobase submodule
        env:
          GH_TOKEN: ${{ secrets.SUBMODULES_TOKEN || github.token }}
        run: |
          git config url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "git@github.com:"
          git submodule update --init apps/grobase
      - name: cargo test --workspace
        run: |
          docker run --rm -e CARGO_NET_RETRY=10 -e CARGO_HTTP_MULTIPLEXING=false \
            -v "$PWD/apps/grobase/infra/docker/services/realtime/realtime-agnostic:/src" -w /src \
            rust:1-bookworm cargo test --workspace

  static:
    name: Static config (manifest parity + Prometheus rules)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}
      - name: Check out grobase submodule
        env:
          GH_TOKEN: ${{ secrets.SUBMODULES_TOKEN || github.token }}
        run: |
          git config url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "git@github.com:"
          git submodule update --init apps/grobase
      - name: package manifest parity (config == Go-embedded copy)
        working-directory: apps/grobase
        run: |
          diff <(jq -S . infra/config/packages/packages.json) \
               <(jq -S . src/control-plane/internal/packages/packages.json) \
            && echo "package manifest is the single source of truth"
      - name: Prometheus rules + config (m52)
        working-directory: apps/grobase
        run: |
          docker run --rm --entrypoint promtool \
            -v "$PWD/infra/config/prometheus":/etc/prometheus \
            prom/prometheus:v2.52.0 check config /etc/prometheus/prometheus.yml
      - name: shellcheck verify gates (advisory)
        working-directory: apps/grobase
        run: shellcheck -S error scripts/verify/m*.sh || true
