# BaaS CI — fast pre-merge checks for the grobase backend.
#
# Each job is one documented Makefile target (subject: single-command / make entrypoints).
# grobase is a SEPARATE repo (Univers42/grobase), tracked here as apps/grobase.
name: BaaS CI

on:
  pull_request:
    paths:
      - "apps/grobase"
      - "utils/mk/baas.mk"
      - ".github/workflows/baas-ci.yml"
  push:
    branches: ["main", "develop", "feat/**", "fix/**", "chore/**"]
    paths:
      - "apps/grobase"
      - "utils/mk/baas.mk"
      - ".github/workflows/baas-ci.yml"
  workflow_dispatch:

concurrency:
  group: baas-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go control-plane (make baas-ci-go)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}
      - name: Check out grobase submodule
        env:
          GH_TOKEN: ${{ secrets.SUBMODULES_TOKEN || github.token }}
        run: |
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "git@github.com:"
          git submodule update --init apps/grobase
      - name: make baas-ci-go
        run: make baas-ci-go

  rust-data-plane:
    name: Rust data-plane (make baas-ci-rust-data-plane)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}
      - name: Check out grobase submodule
        env:
          GH_TOKEN: ${{ secrets.SUBMODULES_TOKEN || github.token }}
        run: |
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "git@github.com:"
          git submodule update --init apps/grobase
      - name: make baas-ci-rust-data-plane
        run: make baas-ci-rust-data-plane

  rust-realtime:
    name: Rust realtime (make baas-ci-rust-realtime)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}
      - name: Check out grobase submodule
        env:
          GH_TOKEN: ${{ secrets.SUBMODULES_TOKEN || github.token }}
        run: |
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "git@github.com:"
          git submodule update --init apps/grobase
      - name: make baas-ci-rust-realtime
        run: make baas-ci-rust-realtime

  static:
    name: Static config (make baas-ci-static)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}
      - name: Check out grobase submodule
        env:
          GH_TOKEN: ${{ secrets.SUBMODULES_TOKEN || github.token }}
        run: |
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "git@github.com:"
          git submodule update --init apps/grobase
      - name: make baas-ci-static
        run: make baas-ci-static
