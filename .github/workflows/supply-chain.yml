name: Supply Chain

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: supply-chain-${{ github.ref }}
  cancel-in-progress: true

jobs:
  npm-frozen-installs:
    name: npm frozen installs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}
      # Init only the frontend submodules we install here (not the heavy grobase
      # backend submodule). --recursive picks up their own nested submodules.
      - name: Check out frontend submodules
        env:
          GH_TOKEN: ${{ secrets.SUBMODULES_TOKEN || github.token }}
        run: |
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "git@github.com:"
          git submodule update --init \
            apps/mail apps/calendar apps/osionos/app

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify npm lockfiles without lifecycle scripts
        run: |
          set -euo pipefail
          for dir in apps/mail apps/calendar apps/osionos/app/src/shared/lib/markengine; do
            echo "checking ${dir}"
            (cd "${dir}" && npm ci --ignore-scripts)
          done

  pnpm-frozen-installs:
    name: pnpm frozen installs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}
      - name: Check out osionos submodule
        env:
          GH_TOKEN: ${{ secrets.SUBMODULES_TOKEN || github.token }}
        run: |
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "git@github.com:"
          # opposite-osiris is a pnpm project that consumes @grobase/js via a file:
          # path into the grobase submodule, so init grobase (non-recursive) too.
          git submodule update --init apps/grobase apps/opposite-osiris apps/osionos/app

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.32.1 --activate

      - name: Verify pnpm lockfiles with approved build scripts only
        run: |
          set -euo pipefail
          # notion-database-sys is dropped: osionos/app pins it at a commit that no
          # longer exists upstream (orphaned ref) — re-pin it in the osionos repo to restore.
          for dir in apps/osionos/app apps/opposite-osiris; do
            echo "checking ${dir}"
            (cd "${dir}" && pnpm install --frozen-lockfile --prefer-offline --ignore-scripts)
          done
