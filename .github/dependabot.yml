# Dependabot for the `groot` superproject.
#
# The application code (mail, calendar, opposite-osiris, osionos, grobase) lives in
# SUBMODULES — their package manifests are not present in this superproject's tree,
# so npm/pnpm ecosystems pointed at those paths cannot resolve a manifest here and
# fail. Each submodule repo runs its OWN Dependabot for its JS deps. This config
# only covers what the superproject itself owns: Docker base images, the GitHub
# Actions it runs, and the submodule pointers themselves.
version: 2
updates:
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
