# SonarQube Cloud Automatic Analysis reads this file, not sonar-project.properties: the project is
# Univers42_groot and no scanner runs in CI.
#
# None of these paths is product code. Analysed as if it were, they held Security and Reliability
# Rating on New Code at D (2026-11-04): 14 of the 16 findings on new code sit here.
#   tests/**                          test code: throwaway services, fixture paths and fixed /tmp
#   apps/osionos-electron/test/**     the desktop app's tests and smoke rigs
#   apps/osionos-electron/native/supervisor-run.mjs
#                                     integration harness: copied into native-runtime/, but only
#                                     Dockerfile.native-test runs it, never the app
#   scripts/verify/**                 live-stack proofs: plain HTTP to compose services by design
#   tools/seeds/**                    operator-run demo seeding: `random` picks fake rows, and paths
#                                     are the operator's own arguments; no image contains it
#   playground/**                     practice datasets and their loaders; nothing deploys them
#   archive/**                        retired docs; nothing builds or serves them
#
# Caveat: an excluded file gets no analysis at all, so a real defect in one is invisible here and
# only its own suite can catch it.
sonar.exclusions=tests/**,apps/osionos-electron/test/**,apps/osionos-electron/native/supervisor-run.mjs,scripts/verify/**,tools/seeds/**,playground/**,archive/**

# scripts/verify/** is the SQL and shell test harness: each case repeats the same claims and
# SQLSTATE setup, which is test code, not product duplication. The helper that removes the
# repetition is tracked in https://github.com/Univers42/groot/issues/106.
sonar.cpd.exclusions=scripts/verify/**
