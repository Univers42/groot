# SonarCloud automatic analysis (the PR check; sonar-project.properties belongs to the CI scan).
# scripts/verify/** is the SQL and shell test harness: each case repeats the same claims and
# SQLSTATE setup, which is test code, not product duplication. The helper that removes the
# repetition is tracked in https://github.com/Univers42/groot/issues/106.
sonar.cpd.exclusions=scripts/verify/**
