# The beta's edge (ADR 0040). :3010 is https://baas.tail10f2ea.ts.net:8444 (the develop app, and
# production's BaaS and auth paths); :3011 is :10001 (production's bridge). Only the exact beta
# origin is admitted and presented as production's (B1); production's CORS answer is rewritten
# back to exactly the beta origin, never * and never an echo (B2).
map $http_origin $beta_origin_ok {
  ""                                      1;
  "https://baas.tail10f2ea.ts.net:8444"   1;
  default                                 0;
}
map $http_origin $prod_origin {
  "https://baas.tail10f2ea.ts.net:8444"   "https://baas.tail10f2ea.ts.net:8443";
  default                                 "";
}
map $http_referer $prod_referer {
  "~^https://baas\.tail10f2ea\.ts\.net:8444(?<rest>/.*)?$"  "https://baas.tail10f2ea.ts.net:8443$rest";
  default                                                   "";
}
map $upstream_http_access_control_allow_origin $beta_acao {
  "https://baas.tail10f2ea.ts.net:8443"   "https://baas.tail10f2ea.ts.net:8444";
  default                                 "";
}
map $http_upgrade $connection_upgrade { default upgrade; "" close; }

resolver 127.0.0.11 valid=30s;
proxy_http_version 1.1;
proxy_set_header Host localhost;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;
proxy_set_header X-Forwarded-For $http_x_forwarded_for;
proxy_ssl_verify off;
proxy_read_timeout 3600s;

server {
  listen 3010;
  # Production's headers on :3001, verbatim (B6).
  add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(self), geolocation=(), gyroscope=(), magnetometer=(), microphone=(self), midi=(), payment=(), picture-in-picture=(), publickey-credentials-get=(), screen-wake-lock=(), sync-xhr=(self), usb=(), xr-spatial-tracking=()" always;
  add_header X-Frame-Options "DENY" always;
  add_header Content-Security-Policy "frame-ancestors 'none'" always;
  if ($beta_origin_ok = 0) { return 403; }

  set $prod_proxy https://track-binocle-local-https-proxy-1;
  set $beta_app http://osionos-beta-app;
  location ~ ^/(auth|rest|realtime|storage|query|meta)/v1/ { proxy_set_header Origin $prod_origin; proxy_set_header Referer $prod_referer; proxy_pass $prod_proxy:3001; }
  location /v1/tenants/      { proxy_set_header Origin $prod_origin; proxy_set_header Referer $prod_referer; proxy_pass $prod_proxy:3001; }
  location /api/auth         { proxy_set_header Origin $prod_origin; proxy_set_header Referer $prod_referer; proxy_pass $prod_proxy:8787; }
  location /api/newsletter   { proxy_set_header Origin $prod_origin; proxy_set_header Referer $prod_referer; proxy_pass $prod_proxy:8787; }
  location / {
    # Uncompressed, so the banner can be written into the page (B8).
    proxy_set_header Accept-Encoding "";
    sub_filter_once on;
    sub_filter "<body" "<div style=\"position:fixed;z-index:2147483647;left:50%;bottom:6px;transform:translateX(-50%);padding:3px 10px;border-radius:6px;background:#b45309;color:#fff;font:600 12px system-ui,sans-serif;pointer-events:none;opacity:.9\">BETA · develop build · writes real data</div><body";
    proxy_pass $beta_app:80;
  }
}

server {
  listen 3011;
  if ($beta_origin_ok = 0) { return 403; }
  set $prod_proxy https://track-binocle-local-https-proxy-1;
  location / {
    proxy_set_header Origin $prod_origin;
    proxy_set_header Referer $prod_referer;
    proxy_buffering off;
    proxy_hide_header Access-Control-Allow-Origin;
    add_header Access-Control-Allow-Origin $beta_acao always;
    proxy_pass $prod_proxy:4000;
  }
}
