# edge.conf — the eval stack's only entry point.
#
# Two routes and a health probe:
#   /rest/v1/ → PostgREST   (prefix STRIPPED, like live Kong)
#   /auth/v1/  → GoTrue     (prefix STRIPPED, like live Kong)
#   /health   → 200 "ok"    (the edge's own liveness, nothing behind it)
#
# The prefix is stripped by the rewrite: nginx replaces the matched
# location prefix, so /rest/v1/osionos_pages reaches PostgREST as
# /osionos_pages. Without it PostgREST received "/rest/v1/osionos_pages"
# and answered 404 — the table is not called that.
#
# The upstreams are resolved PER REQUEST, not at start-up. A static
# `proxy_pass http://eval-postgrest:3000` makes nginx resolve the name
# while it parses its config, and refuse to start when the name does not
# resolve YET: PostgREST and GoTrue are restarted by migrate.sh (neither
# can start before the bootstrap created their roles), so their names are
# not always resolvable at boot. Docker's embedded DNS is the resolver.
events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;

        location /rest/v1/ {
            set $postgrest_upstream eval-postgrest:3000;
            rewrite ^/rest/v1/(.*)$ /$1 break;
            # The variable is assigned to a fixed Docker service name above,
            # never from request input; it also defers DNS until request time.
            proxy_pass http://$postgrest_upstream; # nosemgrep: generic.nginx.security.dynamic-proxy-host.dynamic-proxy-host
            # Nginx's incoming Host is required by this local edge; it is not
            # used to select the upstream, which is pinned above.
            proxy_set_header Host $host; # nosemgrep: generic.nginx.security.request-host-used.request-host-used
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /auth/v1/ {
            set $gotrue_upstream eval-gotrue:9999;
            rewrite ^/auth/v1/(.*)$ /$1 break;
            # Fixed service name, assigned server-side; variable proxying lets
            # nginx survive the service being absent during startup.
            proxy_pass http://$gotrue_upstream; # nosemgrep: generic.nginx.security.dynamic-proxy-host.dynamic-proxy-host
            proxy_set_header Host $host; # nosemgrep: generic.nginx.security.request-host-used.request-host-used
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # The edge's own liveness. `return` runs before any proxy_pass, so
        # this says nothing about GoTrue — that is what check 2 is for
        # (GET /auth/v1/health THROUGH the edge).
        location = /health {
            access_log off;
            default_type text/plain;
            return 200 "ok\\n";
        }
    }
}
