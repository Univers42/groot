events {}

http {
  client_max_body_size 50M;

  # Optional snippets: docker-compose.public.yml mounts infrastructure/tls/public.d here.
  # Unmounted, no file matches and nginx accepts the empty glob, so local behaviour is unchanged.
  include /etc/nginx/track-binocle.d/http-*.conf;
  resolver 127.0.0.11 ipv6=off valid=10s;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  # Name-based vhosts under *.track-binocle.test (SAN-covered by the same local
  # dev cert). One shared 443 listener below routes by $host instead of one
  # listen-port per app, so a new app is one map line, not a new server block.
  # The dictation: its OWN bucket, keyed like the AI one (the client address).
  # It lives here and not in public.d/ because the voice route is off on the
  # public stack until the user says otherwise — but the zone must exist in
  # BOTH modes, or the location below would not load.
  limit_req_zone $binary_remote_addr zone=public_ai_voice:10m rate=1r/s;

  map $host $track_binocle_domain_upstream {
    website.track-binocle.test          opposite-osiris-web:8080;
    editor.track-binocle.test           osionos-app:80;
    bridge.track-binocle.test           osionos-bridge:4000;
    auth.track-binocle.test             auth-gateway:8787;
    mail.track-binocle.test             mail:3002;
    mail-bridge.track-binocle.test      mail-bridge:4100;
    calendar.track-binocle.test         calendar:3003;
    calendar-bridge.track-binocle.test  calendar-bridge:4200;
  }

  # The confirm-email and reset-password pages carry a one-time token in the URL
  # fragment; no-referrer there keeps any later navigation from leaking the page
  # (verdict B C2). Mirrors the site image's own map (default.conf.template), and the
  # upstream copy is hidden below so exactly one Referrer-Policy reaches the browser.
  map $uri $track_binocle_referrer_policy {
    ~^/auth/(confirm|reset-password)(/|$)  "no-referrer";
    default                                "strict-origin-when-cross-origin";
  }

  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:track_binocle_tls:10m;
  ssl_session_timeout 10m;
  # $host/$http_host below are the loopback-only TLS front door's own request host
  # (server_name is the localhost/127.0.0.1 allowlist). They are forwarded so upstreams
  # that do vhost-based routing (Astro/osionos/kong) see the right host, and so the
  # 497->308 HTTP->HTTPS redirect preserves scheme/host/port. Not attacker-spoofable on a
  # localhost-only proxy. Pinning to a literal would break that routing, so the request-host
  # rule is suppressed on the three lines below with an explicit reason.
  error_page 497 =308 https://$host:$server_port$request_uri; # nosemgrep: generic.nginx.security.request-host-used.request-host-used

  proxy_http_version 1.1;
  proxy_set_header Host $http_host; # nosemgrep: generic.nginx.security.request-host-used.request-host-used
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header X-Forwarded-Host $host; # nosemgrep: generic.nginx.security.request-host-used.request-host-used
  proxy_set_header X-Forwarded-Port $server_port;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  proxy_read_timeout 1h;
  proxy_send_timeout 1h;

  # NOTE on the `set $track_binocle_upstream <name>; proxy_pass http://$upstream;` pattern
  # used by every server below: the upstream is a FIXED Docker service name set server-side
  # (never client input). The variable form is required so nginx resolves it lazily via the
  # `resolver` above at request time — that keeps this proxy bootable even when an upstream
  # container is down/restarting (a literal proxy_pass resolves at config load and would make
  # nginx fail to start). Hence the dynamic-proxy-host rule is suppressed per proxy_pass line.

  server {
    listen 4322 ssl;
    server_name localhost 127.0.0.1;
    ssl_certificate /etc/track-binocle/certs/localhost.pem;
    ssl_certificate_key /etc/track-binocle/certs/localhost-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    set $track_binocle_upstream opposite-osiris-web:8080;
    # Security hardening headers for the website. The CSP itself is emitted by
    # the app (Astro security.csp meta, incl. frame-ancestors 'none'); these are
    # the transport/clickjacking/sniffing defenses the proxy must add because the
    # website does not pass through Kong (which only fronts /api). `always` makes
    # nginx emit them even on proxied/error responses.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    # frame-ancestors only takes effect as an HTTP header (it is ignored in the
    # app's <meta> CSP). Header-only policy with a single directive does not
    # restrict scripts/styles — the app's strict <meta> CSP still governs those.
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header Referrer-Policy $track_binocle_referrer_policy always;
    add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(self), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), publickey-credentials-get=(), screen-wake-lock=(), sync-xhr=(self), usb=(), xr-spatial-tracking=()" always;
    # opposite-osiris-web bakes its own Permissions-Policy header too; nginx
    # add_header APPENDS (does not replace), so hide the upstream copy — it still
    # carries the unsupported `web-share` token that triggers a console warning.
    location / {
      proxy_hide_header Permissions-Policy;
      proxy_hide_header Referrer-Policy;
      proxy_pass http://$track_binocle_upstream; # nosemgrep: generic.nginx.security.dynamic-proxy-host.dynamic-proxy-host
    }
  }

  # osionos editor. The BaaS gateway prefixes are mounted on THIS origin on
  # purpose: the browser then needs exactly ONE reachable port for the whole app.
  # VITE_BAAS_URL is baked into the bundle at build time and liveRealtimeUrl()
  # derives the realtime socket from it, so every extra browser-facing port
  # becomes something the host's tunnel/port-forward must also know about —
  # and the day it doesn't, the app half-loads with an unreachable socket.
  # Same-origin removes that coupling for good (and CORS/mixed-content with it).
  # The prefixes below are Kong's routes, not the SPA's; the SPA owns `/`.
  server {
    listen 3001 ssl;
    server_name localhost 127.0.0.1;
    ssl_certificate /etc/track-binocle/certs/localhost.pem;
    ssl_certificate_key /etc/track-binocle/certs/localhost-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    # The APP's own policy — the one of the app origin, on :3001 and on
    # :13001 (the same block: the port is the published one). The microphone
    # is allowed: the dictation needs it. The landing site above keeps its own,
    # stricter policy — the two are never the same header.
    add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(self), geolocation=(), gyroscope=(), magnetometer=(), microphone=(self), midi=(), payment=(), picture-in-picture=(), publickey-credentials-get=(), screen-wake-lock=(), sync-xhr=(self), usb=(), xr-spatial-tracking=()" always;
    set $track_binocle_upstream osionos-app:80;
    set $track_binocle_baas mini-baas-kong:8000;
    # The osionos origin must never be framed, by anyone. 'none', not 'self': an
    # embedded page can 302 into this origin, and then the frame's ancestor IS
    # this origin, so 'self' would let the SPA boot in the frame and consume an
    # attacker's #bridge_token. Server level so the Kong routes mounted here are
    # covered too; no location below declares add_header, which would drop these.
    # Kong already adds X-Frame-Options: DENY, so hide it to avoid a duplicate. CSP
    # is NOT hidden: storage-router sends `Content-Security-Policy: sandbox` on
    # downloads, and a second CSP header only tightens (both are enforced).
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    proxy_hide_header X-Frame-Options;
    location /auth/v1/     { proxy_pass http://$track_binocle_baas; } # nosemgrep: generic.nginx.security.dynamic-proxy-host.dynamic-proxy-host
    location /rest/v1/     { proxy_pass http://$track_binocle_baas; } # nosemgrep: generic.nginx.security.dynamic-proxy-host.dynamic-proxy-host
    location /realtime/v1/ { proxy_pass http://$track_binocle_baas; } # nosemgrep: generic.nginx.security.dynamic-proxy-host.dynamic-proxy-host
    location /storage/v1/  { proxy_pass http://$track_binocle_baas; } # nosemgrep: generic.nginx.security.dynamic-proxy-host.dynamic-proxy-host
    location /query/v1/    { proxy_pass http://$track_binocle_baas; } # nosemgrep: generic.nginx.security.dynamic-proxy-host.dynamic-proxy-host
    location /meta/v1/     { proxy_pass http://$track_binocle_baas; } # nosemgrep: generic.nginx.security.dynamic-proxy-host.dynamic-proxy-host
    # The self-service console is a Kong route too, and tenantConsoleClient
    # derives its base from VITE_BAAS_URL -- which is THIS origin. Without this
    # line its fetches fell through to `location /` and got the SPA's index.html
    # instead of JSON, so the panel stayed on 'connect a mini-baas project'.
    location /v1/tenants/ { proxy_pass http://$track_binocle_baas; } # nosemgrep: generic.nginx.security.dynamic-proxy-host.dynamic-proxy-host
    location / { proxy_pass http://$track_binocle_upstream; } # nosemgrep: generic.nginx.security.dynamic-proxy-host.dynamic-proxy-host
  }

  server {
    listen 4000 ssl;
    server_name localhost 127.0.0.1;
    ssl_certificate /etc/track-binocle/certs/localhost.pem;
    ssl_certificate_key /etc/track-binocle/certs/localhost-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    set $track_binocle_upstream osionos-bridge:4000;
    include /etc/nginx/track-binocle.d/bridge-*.conf;
    # The AI assistant (services/osionos-ai, compose profile `ai`), behind the
    # same TLS front door as the bridge: the browser knows ONE port.
    #
    # SSE MUST NOT BE BUFFERED: a run answers as a stream of frames, and a
    # buffered proxy holds the first frames until the answer is complete — the
    # user would watch nothing for thirty seconds and then get everything at
    # once. The service sends `X-Accel-Buffering: no` too, but the proxy is
    # what decides whether a chunk leaves as it arrives, hence
    # `proxy_buffering off` here.
    # 64k is the contract's body limit (413 above it), which is why the body
    # limit is repeated here: nginx answers the refusal itself, before the
    # request reaches the service.
    # The include below is the public overlay's hook (its rate limit); it is
    # empty in local mode, where the glob matches no file.
    # The upstream is a VARIABLE (see the note at the top of this file): this
    # proxy must stay bootable when the `ai` profile is not running — that
    # path answers 502, it does not stop nginx.
    location /api/ai/ {
      set $track_binocle_ai osionos-ai:4300;
      proxy_pass http://$track_binocle_ai; # nosemgrep: generic.nginx.security.dynamic-proxy-host.dynamic-proxy-host
      proxy_http_version 1.1;
      # nginx inherits the proxy_set_header lines of the http level only when
      # the current level declares NONE, so the ones below are repeated: the
      # location must carry the same headers as the rest of the :4000 traffic.
      # The Upgrade/Connection pair is NOT repeated — there is no WebSocket
      # here, and `Connection ""` is what keeps the upstream connection alive
      # for a long-lived SSE stream.
      proxy_set_header Host $http_host; # nosemgrep: generic.nginx.security.request-host-used.request-host-used
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Host $host; # nosemgrep: generic.nginx.security.request-host-used.request-host-used
      proxy_set_header X-Forwarded-Port $server_port;
      proxy_set_header Connection "";
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 300s;
      client_max_body_size 64k;
      include /etc/nginx/track-binocle.d/ai-*.conf;
    }
    # The dictation: its OWN location, with its OWN body cap and its OWN
    # bucket — never the 64 KB and the global bucket of /api/ai/ above.
    # The body of a dictation is a 16 kHz mono WAV: 30 s is 960 044 bytes, so
    # 1m is the cap with a little room, and the service refuses more anyway.
    # A refused request is a 429 (not nginx's 503) so the client can tell
    # "slow down" from "broken".
    location = /api/ai/voice/transcribe {
      set $track_binocle_ai osionos-ai:4300;
      proxy_pass http://$track_binocle_ai; # nosemgrep: generic.nginx.security.dynamic-proxy-host.dynamic-proxy-host
      proxy_http_version 1.1;
      # The same headers as /api/ai/ above: nginx inherits the proxy_set_header
      # lines of the http level only when the current level declares NONE.
      proxy_set_header Host $http_host; # nosemgrep: generic.nginx.security.request-host-used.request-host-used
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Host $host; # nosemgrep: generic.nginx.security.request-host-used.request-host-used
      proxy_set_header X-Forwarded-Port $server_port;
      proxy_set_header Connection "";
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 60s;
      client_max_body_size 1m;
      limit_req zone=public_ai_voice burst=5 nodelay;
      limit_req_status 429;
    }
    location / { proxy_pass http://$track_binocle_upstream; } # nosemgrep: generic.nginx.security.dynamic-proxy-host.dynamic-proxy-host
  }

  server {
    listen 8787 ssl;
    server_name localhost 127.0.0.1;
    ssl_certificate /etc/track-binocle/certs/localhost.pem;
    ssl_certificate_key /etc/track-binocle/certs/localhost-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    set $track_binocle_upstream auth-gateway:8787;
    location / { proxy_pass http://$track_binocle_upstream; } # nosemgrep: generic.nginx.security.dynamic-proxy-host.dynamic-proxy-host
  }

  # TLS front door for the grobase BaaS gateway (Kong data plane), on 8444 — NOT 8000:
  # Kong publishes its own plain-HTTP socket on the host's 127.0.0.1:8000, so this proxy
  # cannot bind there. Each port below equals the published host port (docker-compose.yml);
  # the host-side tunnel map is parsed out of the directives in this file, so the two must
  # never diverge. Upstream is the container name on the external mini-baas network
  # (mini-baas-kong), which is why this service attaches to that network.
  # Kong's ADMIN API (:8001) is deliberately NOT fronted: it is unauthenticated and grants
  # full gateway control, so it stays off any browser-reachable port.
  server {
    listen 8444 ssl;
    server_name localhost 127.0.0.1;
    ssl_certificate /etc/track-binocle/certs/localhost.pem;
    ssl_certificate_key /etc/track-binocle/certs/localhost-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    set $track_binocle_upstream mini-baas-kong:8000;
    location = / {
      default_type application/json;
      add_header Cache-Control no-store;
      return 200 '{"ok":true,"service":"track-binocle-baas","routes":["/auth/v1","/rest/v1","/meta/v1"],"docs":"README.md"}\n';
    }
    location / { proxy_pass http://$track_binocle_upstream; } # nosemgrep: generic.nginx.security.dynamic-proxy-host.dynamic-proxy-host
  }

  server {
    listen 3002 ssl;
    server_name localhost 127.0.0.1;
    ssl_certificate /etc/track-binocle/certs/localhost.pem;
    ssl_certificate_key /etc/track-binocle/certs/localhost-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    set $track_binocle_upstream mail:3002;
    location / { proxy_pass http://$track_binocle_upstream; } # nosemgrep: generic.nginx.security.dynamic-proxy-host.dynamic-proxy-host
  }

  server {
    listen 4100 ssl;
    server_name localhost 127.0.0.1;
    ssl_certificate /etc/track-binocle/certs/localhost.pem;
    ssl_certificate_key /etc/track-binocle/certs/localhost-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    set $track_binocle_upstream mail-bridge:4100;
    location / { proxy_pass http://$track_binocle_upstream; } # nosemgrep: generic.nginx.security.dynamic-proxy-host.dynamic-proxy-host
  }

  server {
    listen 3003 ssl;
    server_name localhost 127.0.0.1;
    ssl_certificate /etc/track-binocle/certs/localhost.pem;
    ssl_certificate_key /etc/track-binocle/certs/localhost-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    set $track_binocle_upstream calendar:3003;
    location / { proxy_pass http://$track_binocle_upstream; } # nosemgrep: generic.nginx.security.dynamic-proxy-host.dynamic-proxy-host
  }

  server {
    listen 4200 ssl;
    server_name localhost 127.0.0.1;
    ssl_certificate /etc/track-binocle/certs/localhost.pem;
    ssl_certificate_key /etc/track-binocle/certs/localhost-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    set $track_binocle_upstream calendar-bridge:4200;
    location / { proxy_pass http://$track_binocle_upstream; } # nosemgrep: generic.nginx.security.dynamic-proxy-host.dynamic-proxy-host
  }

  # hydrawn, the whiteboard osionos frames, on an origin of its own (devil C592). A static
  # page with no API: it saves through the bridge on :4000 with a short whiteboard token
  # it asks the osionos frame for, so nothing on this port grants anything. The headers
  # (the CSP whose frame-ancestors names exactly the osionos origin, nosniff, no-referrer)
  # are hydrawn-web's own and this block adds none: an add_header here would replace them.
  # Not part of :443: that vhost sets X-Frame-Options DENY, which would stop osionos framing it.
  server {
    listen 3008 ssl;
    server_name localhost 127.0.0.1;
    ssl_certificate /etc/track-binocle/certs/localhost.pem;
    ssl_certificate_key /etc/track-binocle/certs/localhost-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    set $track_binocle_upstream hydrawn-web:8080;
    # DNS-rebinding guard: a page on an attacker's domain re-pointed at 127.0.0.1 would
    # otherwise reach this port as same-origin. 444 = close without a response.
    if ($http_host !~* '^(localhost|127\.0\.0\.1)(:[0-9]+)?$') { return 444; }
    location / { proxy_pass http://$track_binocle_upstream; } # nosemgrep: generic.nginx.security.dynamic-proxy-host.dynamic-proxy-host
  }

  # NOTE: there is deliberately no :8200 Vault front door here. Vault runs only under
  # the compose `secrets` profile and is not part of the default stack, so the block
  # that used to sit here proxied to an upstream that never resolved. Scripts and
  # bootstrap containers reach Vault directly on the Docker network (http://vault:8200);
  # nothing needs a browser-reachable TLS edge for it. Re-add a block here only together
  # with a published port in docker-compose.yml, or it is dead config again.

  # osionos-ide-server on 8446. The preview capability travels in the URL path
  # (/p/pc1.<payload>.<mac>/), so this vhost logs nothing — nginx's default
  # access log is the container's stdout. The headers (CSP sandbox, nosniff,
  # CORP, ACAO) come from the IDE server, and this block adds none; adding
  # them would duplicate or override them.
  server {
    listen 8446 ssl;
    server_name localhost 127.0.0.1;
    ssl_certificate /etc/track-binocle/certs/localhost.pem;
    ssl_certificate_key /etc/track-binocle/certs/localhost-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    set $track_binocle_upstream osionos-ide-server:4100;
    location / { proxy_pass http://$track_binocle_upstream; } # nosemgrep: generic.nginx.security.dynamic-proxy-host.dynamic-proxy-host
  }

  # One shared HTTPS entry point for every *.track-binocle.test app. $host is
  # constrained by server_name to the fixed list below (same not-attacker-input
  # trust model as the per-port blocks above), so it is safe to key the map on.
  server {
    listen 443 ssl;
    server_name
      website.track-binocle.test
      editor.track-binocle.test
      bridge.track-binocle.test
      auth.track-binocle.test
      mail.track-binocle.test
      mail-bridge.track-binocle.test
      calendar.track-binocle.test
      calendar-bridge.track-binocle.test;
    ssl_certificate /etc/track-binocle/certs/localhost.pem;
    ssl_certificate_key /etc/track-binocle/certs/localhost-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy $track_binocle_referrer_policy always;

    set $track_binocle_upstream $track_binocle_domain_upstream;
    location / {
      if ($track_binocle_domain_upstream = "") { return 404; }
      proxy_hide_header Referrer-Policy;
      proxy_pass http://$track_binocle_upstream; # nosemgrep: generic.nginx.security.dynamic-proxy-host.dynamic-proxy-host
    }
  }
}
