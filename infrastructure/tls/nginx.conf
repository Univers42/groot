events {}

http {
  client_max_body_size 50M;
  resolver 127.0.0.11 ipv6=off valid=10s;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:track_binocle_tls:10m;
  ssl_session_timeout 10m;
  # $host/$http_host below are the loopback-only TLS front door's own request host
  # (server_name is the localhost/127.0.0.1 allowlist). They are forwarded so upstreams
  # that do vhost-based routing (Astro/osionos/kong) see the right host, and so the
  # 497->308 HTTP->HTTPS redirect preserves scheme/host/port. Not attacker-spoofable on a
  # localhost-only proxy. Pinning to a literal would break that routing, so the request-host
  # rule is suppressed on the three lines below with an explicit reason.
  error_page 497 =308 https://$host:$server_port$request_uri; # nosemgrep: generic.nginx.security.request-host-used.request-host-used

  proxy_http_version 1.1;
  proxy_set_header Host $http_host; # nosemgrep: generic.nginx.security.request-host-used.request-host-used
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header X-Forwarded-Host $host; # nosemgrep: generic.nginx.security.request-host-used.request-host-used
  proxy_set_header X-Forwarded-Port $server_port;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  proxy_read_timeout 1h;
  proxy_send_timeout 1h;

  # NOTE on the `set $track_binocle_upstream <name>; proxy_pass http://$upstream;` pattern
  # used by every server below: the upstream is a FIXED Docker service name set server-side
  # (never client input). The variable form is required so nginx resolves it lazily via the
  # `resolver` above at request time — that keeps this proxy bootable even when an upstream
  # container is down/restarting (a literal proxy_pass resolves at config load and would make
  # nginx fail to start). Hence the dynamic-proxy-host rule is suppressed per proxy_pass line.

  server {
    listen 4322 ssl;
    server_name localhost 127.0.0.1;
    ssl_certificate /etc/track-binocle/certs/localhost.pem;
    ssl_certificate_key /etc/track-binocle/certs/localhost-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    set $track_binocle_upstream opposite-osiris-web:8080;
    # Security hardening headers for the website. The CSP itself is emitted by
    # the app (Astro security.csp meta, incl. frame-ancestors 'none'); these are
    # the transport/clickjacking/sniffing defenses the proxy must add because the
    # website does not pass through Kong (which only fronts /api). `always` makes
    # nginx emit them even on proxied/error responses.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    # frame-ancestors only takes effect as an HTTP header (it is ignored in the
    # app's <meta> CSP). Header-only policy with a single directive does not
    # restrict scripts/styles — the app's strict <meta> CSP still governs those.
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(self), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), publickey-credentials-get=(), screen-wake-lock=(), sync-xhr=(self), usb=(), xr-spatial-tracking=()" always;
    # opposite-osiris-web bakes its own Permissions-Policy header too; nginx
    # add_header APPENDS (does not replace), so hide the upstream copy — it still
    # carries the unsupported `web-share` token that triggers a console warning.
    location / {
      proxy_hide_header Permissions-Policy;
      proxy_pass http://$track_binocle_upstream; # nosemgrep: generic.nginx.security.dynamic-proxy-host.dynamic-proxy-host
    }
  }

  # osionos editor. The BaaS gateway prefixes are mounted on THIS origin on
  # purpose: the browser then needs exactly ONE reachable port for the whole app.
  # VITE_BAAS_URL is baked into the bundle at build time and liveRealtimeUrl()
  # derives the realtime socket from it, so every extra browser-facing port
  # becomes something the host's tunnel/port-forward must also know about —
  # and the day it doesn't, the app half-loads with an unreachable socket.
  # Same-origin removes that coupling for good (and CORS/mixed-content with it).
  # The prefixes below are Kong's routes, not the SPA's; the SPA owns `/`.
  server {
    listen 3001 ssl;
    server_name localhost 127.0.0.1;
    ssl_certificate /etc/track-binocle/certs/localhost.pem;
    ssl_certificate_key /etc/track-binocle/certs/localhost-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    set $track_binocle_upstream osionos-app:80;
    set $track_binocle_baas mini-baas-kong:8000;
    location /auth/v1/     { proxy_pass http://$track_binocle_baas; } # nosemgrep: generic.nginx.security.dynamic-proxy-host.dynamic-proxy-host
    location /rest/v1/     { proxy_pass http://$track_binocle_baas; } # nosemgrep: generic.nginx.security.dynamic-proxy-host.dynamic-proxy-host
    location /realtime/v1/ { proxy_pass http://$track_binocle_baas; } # nosemgrep: generic.nginx.security.dynamic-proxy-host.dynamic-proxy-host
    location /storage/v1/  { proxy_pass http://$track_binocle_baas; } # nosemgrep: generic.nginx.security.dynamic-proxy-host.dynamic-proxy-host
    location /query/v1/    { proxy_pass http://$track_binocle_baas; } # nosemgrep: generic.nginx.security.dynamic-proxy-host.dynamic-proxy-host
    location /meta/v1/     { proxy_pass http://$track_binocle_baas; } # nosemgrep: generic.nginx.security.dynamic-proxy-host.dynamic-proxy-host
    location / { proxy_pass http://$track_binocle_upstream; } # nosemgrep: generic.nginx.security.dynamic-proxy-host.dynamic-proxy-host
  }

  server {
    listen 4000 ssl;
    server_name localhost 127.0.0.1;
    ssl_certificate /etc/track-binocle/certs/localhost.pem;
    ssl_certificate_key /etc/track-binocle/certs/localhost-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    set $track_binocle_upstream osionos-bridge:4000;
    location / { proxy_pass http://$track_binocle_upstream; } # nosemgrep: generic.nginx.security.dynamic-proxy-host.dynamic-proxy-host
  }

  server {
    listen 8787 ssl;
    server_name localhost 127.0.0.1;
    ssl_certificate /etc/track-binocle/certs/localhost.pem;
    ssl_certificate_key /etc/track-binocle/certs/localhost-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    set $track_binocle_upstream auth-gateway:8787;
    location / { proxy_pass http://$track_binocle_upstream; } # nosemgrep: generic.nginx.security.dynamic-proxy-host.dynamic-proxy-host
  }

  # TLS front door for the grobase BaaS gateway (Kong data plane), on 8444 — NOT 8000:
  # Kong publishes its own plain-HTTP socket on the host's 127.0.0.1:8000, so this proxy
  # cannot bind there. Each port below equals the published host port (docker-compose.yml);
  # the host-side tunnel map is parsed out of the directives in this file, so the two must
  # never diverge. Upstream is the container name on the external mini-baas network
  # (mini-baas-kong), which is why this service attaches to that network.
  # Kong's ADMIN API (:8001) is deliberately NOT fronted: it is unauthenticated and grants
  # full gateway control, so it stays off any browser-reachable port.
  server {
    listen 8444 ssl;
    server_name localhost 127.0.0.1;
    ssl_certificate /etc/track-binocle/certs/localhost.pem;
    ssl_certificate_key /etc/track-binocle/certs/localhost-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    set $track_binocle_upstream mini-baas-kong:8000;
    location = / {
      default_type application/json;
      add_header Cache-Control no-store;
      return 200 '{"ok":true,"service":"track-binocle-baas","routes":["/auth/v1","/rest/v1","/meta/v1"],"docs":"README.md"}\n';
    }
    location / { proxy_pass http://$track_binocle_upstream; } # nosemgrep: generic.nginx.security.dynamic-proxy-host.dynamic-proxy-host
  }

  server {
    listen 3002 ssl;
    server_name localhost 127.0.0.1;
    ssl_certificate /etc/track-binocle/certs/localhost.pem;
    ssl_certificate_key /etc/track-binocle/certs/localhost-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    set $track_binocle_upstream mail:3002;
    location / { proxy_pass http://$track_binocle_upstream; } # nosemgrep: generic.nginx.security.dynamic-proxy-host.dynamic-proxy-host
  }

  server {
    listen 4100 ssl;
    server_name localhost 127.0.0.1;
    ssl_certificate /etc/track-binocle/certs/localhost.pem;
    ssl_certificate_key /etc/track-binocle/certs/localhost-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    set $track_binocle_upstream mail-bridge:4100;
    location / { proxy_pass http://$track_binocle_upstream; } # nosemgrep: generic.nginx.security.dynamic-proxy-host.dynamic-proxy-host
  }

  server {
    listen 3003 ssl;
    server_name localhost 127.0.0.1;
    ssl_certificate /etc/track-binocle/certs/localhost.pem;
    ssl_certificate_key /etc/track-binocle/certs/localhost-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    set $track_binocle_upstream calendar:3003;
    location / { proxy_pass http://$track_binocle_upstream; } # nosemgrep: generic.nginx.security.dynamic-proxy-host.dynamic-proxy-host
  }

  server {
    listen 4200 ssl;
    server_name localhost 127.0.0.1;
    ssl_certificate /etc/track-binocle/certs/localhost.pem;
    ssl_certificate_key /etc/track-binocle/certs/localhost-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    set $track_binocle_upstream calendar-bridge:4200;
    location / { proxy_pass http://$track_binocle_upstream; } # nosemgrep: generic.nginx.security.dynamic-proxy-host.dynamic-proxy-host
  }

  # NOTE: there is deliberately no :8200 Vault front door here. Vault runs only under
  # the compose `secrets` profile and is not part of the default stack, so the block
  # that used to sit here proxied to an upstream that never resolved. Scripts and
  # bootstrap containers reach Vault directly on the Docker network (http://vault:8200);
  # nothing needs a browser-reachable TLS edge for it. Re-add a block here only together
  # with a published port in docker-compose.yml, or it is dead config again.
}
