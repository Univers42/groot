# LiveKit's signalling on the bridge's TLS origin (:4000, :10000 through the Funnel), so the
# browser opens wss://<bridge origin>/livekit/rtc/... and never the SFU's plain ws:// :7880
# (groot#174, subject III.3). livekit-client 2.19.0 appends /rtc/v1 (and /rtc/v1/validate) to
# the path of the URL the bridge hands out, so /livekit is stripped here and the SFU sees /rtc.
# Only /rtc is fronted: the SFU's /twirp admin API stays on the internal network.
# Included in the :4000 server of nginx.conf (bridge-*.conf). It declares no proxy_set_header,
# so the http-level Upgrade/Connection pair applies. The upstream is a variable, like every
# other one: the proxy boots when the livekit profile is down, and this path answers 502.
location ^~ /livekit/rtc {
  set $track_binocle_livekit livekit:7880;
  rewrite ^/livekit(/.*)$ $1 break;
  proxy_pass http://$track_binocle_livekit; # nosemgrep: generic.nginx.security.dynamic-proxy-host.dynamic-proxy-host
  proxy_buffering off;
}
