# Public mode: bridge routes the internet must not reach, and the one it may reach slowly.
# Included in the :4000 server before `location /`. Exact-match locations, so a path variant
# falls through to the bridge, whose own flag (OSIONOS_AGENT_CLAUDE, forced empty by the
# overlay) is the second lock.
location = /api/agent/claude/stream { return 404; }

# 1 r/s, burst 5, no delay: a sixth rapid request in a row is answered 503.
location = /api/geocode {
  limit_req zone=public_geocode burst=5 nodelay;
  proxy_pass http://$track_binocle_upstream; # nosemgrep: generic.nginx.security.dynamic-proxy-host.dynamic-proxy-host
}

# Personal access tokens and remote MCP are not for the public until devil C112-C120 are merged
# with tests (release R-C4): the AI service registers /api/ai/access-tokens unconditionally, so
# the proxy is the first lock and OSIONOS_AI_PAT (forced empty by the overlay) the second.
# ^~ prefix: any sub-path is refused too, and it beats the /api/ai/ location.
location ^~ /api/ai/access-tokens { return 404; }
location ^~ /api/ai/mcp { return 404; }
