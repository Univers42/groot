# Public mode: bridge routes the internet must not reach, and the one it may reach slowly.
# Included in the :4000 server before `location /`. Exact-match locations, so a path variant
# falls through to the bridge, whose own flag (OSIONOS_AGENT_CLAUDE, forced empty by the
# overlay) is the second lock.
location = /api/agent/claude/stream { return 404; }

# 1 r/s, burst 5, no delay: a sixth rapid request in a row is answered 503.
location = /api/geocode {
  limit_req zone=public_geocode burst=5 nodelay;
  proxy_pass http://$track_binocle_upstream;
}

# /api/ai/access-tokens and /api/ai/mcp are no longer refused here (FB4): they reach the AI
# service through the /api/ai/ location of nginx.conf, and the service is the lock (hashed,
# expiring, revocable tokens; Host pinned and no Origin allowed on /mcp; public mode refuses
# write_approval). No CORS for MCP to anybody (devil C118): it is not a browser-app route.
# The locked-CORS map (http-locked-ai-cors.conf.template) stays defined for the app origin.
