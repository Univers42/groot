# Public mode (docker-compose.public.yml): one shared bucket for /api/geocode.
# Caveat: behind Funnel every client reaches nginx from tailscaled's loopback address, so the
# bucket is global, not per visitor: one busy visitor can starve the others. That is the safe
# direction for a quota-backed upstream; a per-visitor key needs the trusted-hop X-Forwarded-For.
limit_req_zone $binary_remote_addr zone=public_geocode:1m rate=1r/s;

# The AI assistant: one bucket for /api/ai/. Same caveat as the geocode one
# (behind Funnel every client arrives from tailscaled's loopback address, so
# the bucket is global, not per visitor) — and here the safe direction matters
# more: an AI answer costs money upstream, so a busy visitor must not be able
# to spend the platform's budget for the others.
limit_req_zone $binary_remote_addr zone=public_ai:10m rate=2r/s;
