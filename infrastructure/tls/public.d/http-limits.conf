# Public mode (docker-compose.public.yml): one shared bucket for /api/geocode.
# Caveat: behind Funnel every client reaches nginx from tailscaled's loopback address, so the
# bucket is global, not per visitor: one busy visitor can starve the others. That is the safe
# direction for a quota-backed upstream; a per-visitor key needs the trusted-hop X-Forwarded-For.
limit_req_zone $binary_remote_addr zone=public_geocode:1m rate=1r/s;

# The AI assistant: one bucket per real client for /api/ai/. An AI answer costs
# money upstream, so the key must not be shared by everyone.
# Behind Funnel $remote_addr is the same hop for every visitor, but Funnel's
# reverse proxy APPENDS the real client to X-Forwarded-For: the LAST entry is the
# client, and a forged value can only be prepended.
# Caveat: correct only behind a proxy that appends (Funnel). A direct client of
# 127.0.0.1:4000 could forge the header and pick its own bucket; only the host
# itself can reach that port. No header: falls back to the connecting address.
map $http_x_forwarded_for $ai_client {
    "~(?<ai_last>[^,\s]+)\s*$" $ai_last;
    default $binary_remote_addr;
}
limit_req_zone $ai_client zone=public_ai:10m rate=2r/s;
