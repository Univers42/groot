# grobase-link: the relay that answers to grobase's names on the mini-baas network when
# grobase does not run on this daemon. scripts/grobase-link.sh explains the modes and
# writes GROBASE_LINK_DIR/routes, one "<listen port> <socat address>" per line; the relay
# starts one socat per line. Added through COMPOSE_FILE by infrastructure/makes/
# grobase-link.mk; a plain `docker compose` never reads this file.
#
# nginx (infrastructure/tls/nginx.conf) resolves mini-baas-kong through Docker DNS at
# request time, and the other frontends take the names from docker-compose.yml defaults
# (OSIONOS_BAAS_URL, PUBLIC_BAAS_URL, SMTP_HOST, REDIS_URL, REALTIME_PUBLISH_URL), so a
# network alias is the one thing that reaches all of them without touching their config.
# In direct mode the relay also routes 6379/1025/8025 to the two stand-ins below: sessions
# and captured mail live on this device, never published (no ports, no aliases — the relay
# owns grobase's names — and a plain `up` never starts them: profile link-direct).
# grobase-link-hostport is direct mode's Kong copy on 127.0.0.1:GROBASE_LINK_HOST_PORT for
# host tools (healthcheck, demo-login), the ssh forward's job in ssh mode; a service of its
# own so a taken port costs the host tools, never the relay.
services:
  grobase-link:
    image: alpine/socat:1.8.0.1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        [ -s /link/routes ] || { echo 'grobase-link: no routes; run: make link' >&2; exit 1; }
        while read -r port target; do
          [ -n "$$port" ] && socat TCP-LISTEN:$$port,fork,reuseaddr "$$target" &
        done </link/routes
        wait
    volumes:
      - ${GROBASE_LINK_DIR:?set by make link}:/link
    networks:
      mini-baas:
        aliases:
          - mini-baas-kong
          - mini-baas-redis
          - mini-baas-mailpit
          - mailpit
          - mini-baas-realtime
    # A real request through the relay to Kong: a dead tunnel or a moved container shows
    # here, a listening socat alone would not. -t 6 and shut-none: by default socat half-closes
    # when the request ends and waits 0.5 s for the answer; over Tailscale Funnel a half-closed
    # request gets a 502 (measured 2026-10-15: 2/6 checks passed before, 6/6 after), and a slow
    # link (a phone handover) needs longer than 0.5 s.
    # Ponytail: an answer slower than 6 s still reads as unhealthy (compose timeout is 8 s).
    healthcheck:
      test:
        - CMD
        - sh
        - -c
        - >-
          printf 'GET / HTTP/1.0\r\nHost: localhost\r\n\r\n' | timeout 7 socat -t 6 - TCP:127.0.0.1:8000,shut-none | grep -q '^HTTP/'
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 10s
      start_interval: 2s
    restart: unless-stopped
  grobase-link-redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    profiles: [link-direct]
    networks:
      - mini-baas
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 10s
      start_interval: 2s
  grobase-link-mailpit:
    image: axllent/mailpit:v1.22.3
    profiles: [link-direct]
    networks:
      - mini-baas
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - /mailpit
        - readyz
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 10s
      start_interval: 2s
  grobase-link-hostport:
    image: alpine/socat:1.8.0.1
    command: ["TCP-LISTEN:8000,fork,reuseaddr", "TCP:mini-baas-kong:8000"]
    profiles: [link-direct]
    ports:
      - 127.0.0.1:${GROBASE_LINK_HOST_PORT:-28000}:8000
    networks:
      - mini-baas
    restart: unless-stopped
  # Separate from grobase-link: that relay joins mini-baas and answers to
  # grobase's names there, so giving it the IDE name would answer to the IDE
  # on grobase's network too; this relay joins only osionos-ide-edge-net and
  # answers to osionos-ide-server there.
  grobase-link-ide:
    image: alpine/socat:1.8.0.1
    profiles: [link-ide]
    # nodelay: a terminal writes many small chunks, and with Nagle on this hop every PTY round trip
    # waited out the peer's delayed ACK — p50 41.9 ms vs 0.6 ms with it (20 echo round trips,
    # measured 2026-10-13; the ssh hop alone is 0.5 ms).
    command: ["TCP-LISTEN:4100,fork,reuseaddr,nodelay", "UNIX-CONNECT:/link-ide/ide-server-4100.sock"]
    volumes:
      - ${GROBASE_LINK_DIR:?set by make link}/ide:/link-ide:ro
    networks:
      osionos-ide-edge-net:
        aliases:
          - osionos-ide-server
    # The link owner's uid (make link sets it): ssh makes the forwarded socket 0600 in a 0700 dir,
    # and root without CAP_DAC_OVERRIDE gets EACCES on it (measured 2026-10-13). On rootless
    # Docker make link sets 0: container root is the owner there, and the owner's own uid is
    # unmapped inside the container (DOCKER_ROOTLESS, common.mk).
    user: "${GROBASE_LINK_UID:-1000}:${GROBASE_LINK_GID:-1000}"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    # Ponytail: 32m and 64 pids cap a burst of parallel IDE sessions; more
    # concurrent previews than that fail until the caps are raised.
    mem_limit: 32m
    pids_limit: 64
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - sh
        - -c
        - >-
          printf 'GET /healthz HTTP/1.0\r\nHost: localhost\r\n\r\n' | timeout 5 socat -t 4 - TCP:127.0.0.1:4100 | grep -q '^HTTP/1\.[01] 200'
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 10s
      start_interval: 2s

networks:
  osionos-ide-edge-net:
