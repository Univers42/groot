# Read by `vault42 --config utils/vault42.conf` (vendor/scripts/vault42). INI, parsed as text.
# No credential and no absolute path belongs here: roots are relative to this file's directory.
# The vault coordinates (org, project, env) are fixed on purpose: make refuses VAULT42_ORG,
# VAULT42_PROJECT and VAULT42_ENV for these targets, so changing where a push lands is a reviewed edit.

[secrets]
org = univers42
project = groot
env = prod
root = ..
kinds = env secrets
mode = team
# Parity with the old path (ctl-env.sh ALWAYS_PRIVATE + VENDOR_PRIVATE, vault42-team.sh extras).
# apps/*/vendor/* covers the vendor/scripts that apps/grobase carries once its submodule is synced.
private = vendor/* apps/*/vendor/* secrets/*.env secrets/*cert* secrets/*key* secrets/.* *.local *.bak .env.grobase-remote
# secrets/ entries that every holder may read: the engine dumps and their checksums, the restore
# seeds. The same 13 names the toolkit's 2026-10-18 republish ruled shared (devil C3). secrets/my_vault
# is deliberately absent: its owner has not decided, so a push stops and asks (--share or --private).
# apps/grobase/scripts/secrets/* are grobase's tracked, public helper scripts: 42ctl takes every
# file below a directory named secrets, so they are in the tree and must be classified.
shared = secrets/MANIFEST.json secrets/SHA256SUMS secrets/dynamodb-all.tar.gz secrets/inception-mariadb.tar.gz secrets/inception-wordpress.tar.gz secrets/minio.tar.gz secrets/mongo.archive.gz secrets/mssql-all.tar.gz secrets/mysql-all.sql.gz secrets/postgres-all.sql.gz secrets/redis.rdb secrets/sqlite-data.tar.gz secrets/vite-gourmand-data.tar.gz apps/grobase/scripts/secrets/*
pre_push = scripts/vault42-push-guard.sh
post_pull = utils/scripts/vault42-post-pull.sh

# The docker volume archives, in their own env so a different set of people can hold the key.
# A sibling of the checkout: 42ctl derives the project id from this path, so never move it after the
# first push. VAULT42_VOLUMES_ROOT overrides it per machine.
# No `private`: the archives exceed 42ctl's 4 MiB private-file ceiling, so they travel shared inside
# the sole-holder env, as in the tree pushed on 2026-10-18.
[volumes]
org = univers42
project = groot
env = volumes
root = ../../groot-volumes
kinds = volumes
guard = sole-holder
