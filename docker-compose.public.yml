# Public mode overlay: the frontends as the internet sees them, through the host's Tailscale
# Funnel (443 website, 8443 osionos app, 10000 bridge). PUBLIC_SITE_ORIGIN moves the website
# elsewhere (prismatica on Vercel); unset, it is PUBLIC_ORIGIN. Layered LAST, after the link overlay
# and any PUBLIC_COMPOSE_EXTRA file:
#   docker compose -f docker-compose.yml -f docker-compose.grobase-link.yml \
#     -f docker-compose.public.yml --env-file .env.local --env-file .env.public config
# Everything the browser downloads is public, so the bundles are built with no tenant key and
# no realtime token (forced empty, overriding .env.local) and the images carry the :public
# tag, never overwriting the :local ones. wiki/runbooks/public-funnel.md.
x-static-preview: &static-preview
  read_only: true
  tmpfs:
    - /var/cache/nginx
    - /run
    - /tmp
  mem_limit: 64m
  restart: unless-stopped
  networks:
    - apps-static-net
  healthcheck:
    test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/"]
    interval: 30s
    start_period: 5s
    start_interval: 2s
    timeout: 3s
    retries: 3

services:
  osionos-app:
    image: track-binocle/osionos-web:public
    build:
      args:
        VITE_API_URL: ${PUBLIC_ORIGIN:?set PUBLIC_ORIGIN in .env.public}:10000
        # The assistant's only switch (src/features/ai/api/aiClient.ts). The proxy behind :10000
        # sends /api/ai/ to osionos-ai; left empty, release R5 shipped the service with no UI.
        VITE_AI_URL: ${PUBLIC_ORIGIN}:10000
        VITE_PRISMATICA_URL: ${PUBLIC_SITE_ORIGIN:-${PUBLIC_ORIGIN}}
        VITE_BAAS_URL: ${PUBLIC_ORIGIN}:8443
        VITE_BAAS_API_KEY: ""
        VITE_BAAS_KONG_KEY: ""
        VITE_BAAS_REALTIME_TOKEN: ""
        # The IDE is a shell on a shared host and is never exposed (rules in the base file).
        VITE_OSIONOS_IDE_URL: ""
        # Mail and Calendar are framed from the apps node's origins (empty hides the tab: the base
        # file's https://localhost:PORT would frame the visitor's own machine). The whiteboard has
        # no per-user auth and stays hidden.
        VITE_MAIL_APP_URL: ${PUBLIC_MAIL_ORIGIN:-}
        VITE_CALENDAR_APP_URL: ${PUBLIC_CALENDAR_ORIGIN:-}
        VITE_WHITEBOARD_APP_URL: ""
        # Shared spaces live: presence, carets, block-by-block page sync. Safe only because the
        # realtime gateway it talks to (baas) denies unscoped namespaces: born2root's
        # profiles/server.toml sets REALTIME_NAMESPACE_FALLBACK=deny.
        VITE_OSIO_COLLAB_SHARED: "1"

  opposite-osiris-web:
    image: track-binocle/opposite-osiris-web:public
    build:
      args:
        PUBLIC_SITE_URL: ${PUBLIC_SITE_ORIGIN:-${PUBLIC_ORIGIN}}
        PUBLIC_OSIONOS_APP_URL: ${PUBLIC_ORIGIN}:8443
        PUBLIC_AUTH_REQUIRE_EMAIL_VERIFICATION: "true"

  auth-gateway:
    environment:
      PUBLIC_SITE_URL: ${PUBLIC_SITE_ORIGIN:-${PUBLIC_ORIGIN}}
      PUBLIC_OSIONOS_APP_URL: ${PUBLIC_ORIGIN}:8443
      AUTH_REQUIRE_EMAIL_VERIFICATION: "true"
      PUBLIC_AUTH_REQUIRE_EMAIL_VERIFICATION: "true"
      AUTH_DEMO_INSECURE: "false"
      TURNSTILE_BYPASS_LOCAL: "false"
      AUTH_TURNSTILE_OPTIONAL: "true"
      # Open signup is AUTH_SIGNUP_OPEN; an allowlist inherited from .env.local would re-close it.
      AUTH_SIGNUP_OPEN: ${AUTH_SIGNUP_OPEN:-true}
      AUTH_SIGNUP_ALLOWLIST: ""
      AUTH_REGISTER_RATE_LIMIT_PER_HOUR: ${AUTH_REGISTER_RATE_LIMIT_PER_HOUR:-10}
      AUTH_MAIL_DAILY_CAP: ${AUTH_MAIL_DAILY_CAP:-50}
      AUTH_VERIFICATION_EXEMPT: ${AUTH_VERIFICATION_EXEMPT:-}
      AUTH_LINK_SIGNING_KEY: ${AUTH_LINK_SIGNING_KEY:?set AUTH_LINK_SIGNING_KEY in .env.public (make public-env)}
      AUTH_TRUSTED_PROXY_HOPS: ${AUTH_TRUSTED_PROXY_HOPS:?set AUTH_TRUSTED_PROXY_HOPS in .env.public (measure it)}

  osionos-bridge:
    # The :public tags keep the public images apart from the ai-dev stack's :local ones
    # (a public build must never overwrite them); until now only the release overlay set them.
    image: track-binocle/osionos-bridge:public
    environment:
      OSIONOS_APP_URL: ${PUBLIC_ORIGIN}:8443
      OSIONOS_ALLOWED_ORIGIN: ${PUBLIC_ORIGIN}:8443
      PUBLIC_OSIONOS_APP_URL: ${PUBLIC_ORIGIN}:8443
      OSIONOS_ADMIN_EMAILS: ${OSIONOS_ADMIN_EMAILS:?set OSIONOS_ADMIN_EMAILS in .env.public (emails, or none)}
      # environment: beats the bridge's env_file (.env.local), so empty here means off.
      OSIONOS_AGENT_CLAUDE: ""
      OSIONOS_IDE_ALLOWED_SUBJECTS: ""
      OSIONOS_RUNNER_URL: ""
      OSIONOS_SQL_RO: ""
      # No IDE route ships in public: an empty secret makes the mint answer 404, an empty mode is off.
      OSIONOS_IDE_TOKEN_SECRET: ""
      OSIONOS_IDE_ACCESS: ""
      # Moderation logs, never holds or removes, until the per-language precision floor (devil C83);
      # the bridge reads it in scripts/bridge-moderation.mjs moderationMode().
      OSIONOS_MODERATION_ACTIONS: "log"

  # Image generation stays off in public until the prompt gate and the output
  # gate exist (devil C70/C72/C73): environment: beats .env.local, so a stray
  # OSIONOS_AI_IMAGES=on there cannot turn it on. scripts/verify/ai-images-public-off.sh.
  #
  # The public AI set is five services (release verdict R-C4..R-C6, R-C11):
  # osionos-ai, -redis, -embed, -embed-bulk, -indexer. The others of the `ai`
  # profile move to a profile public never enables, so `--profile ai` starts
  # only the five. scripts/verify/ai-public-flags-off.sh proves it.
  osionos-ai:
    image: track-binocle/osionos-ai:public
    ports: !reset []
    # The live (grobase) database, role osionos_ai: never the dev osionos-ai-db
    # with its default password (R-C5). The grobase link relays Kong only, so the
    # URL names the VM's tailnet-only TCP serve of its Postgres (runbook § Public mode).
    # Caveat: every device of the tailnet reaches that port; the role's password is the gate.
    # environment: beats env_file, so empty here means off.
    environment:
      OSIONOS_AI_DATABASE_URL: ${OSIONOS_AI_PUBLIC_DATABASE_URL:?set OSIONOS_AI_PUBLIC_DATABASE_URL in .env.public (the live grobase DB, role osionos_ai)}
      OSIONOS_ALLOWED_ORIGIN: ${PUBLIC_ORIGIN}:8443
      OSIONOS_AI_IMAGES: ""
      OSIONOS_AI_PAT: ""
      # Builder tool (P6 C163) stays off in public until P6a-3 and P6b merge.
      OSIONOS_AI_BUILDERS: ""
      OSIONOS_AI_STT_URL: ""
      # Describe image (M7) stays off in public until the user decides.
      OSIONOS_AI_VLM_URL: ""
      # Remote MCP servers (E1) stay off in public until the run integration
      # and its approvals are merged and proven (devil C288).
      OSIONOS_AI_MCP_CLIENT: ""
      # Web tools stay off in public until a network-isolated fetcher and an SSRF
      # canary e2e exist.
      OSIONOS_AI_WEB: ""
      # Conversation summaries stay off in public until the provider-routing
      # e2e and the quality eval are shown (context C392, C393).
      OSIONOS_AI_SUMMARY: ""
      # The platform connection on public: OpenRouter's free models only (R-C10), the key and
      # the list from .env.public, never .env.local, so the dev stack keeps its local model.
      OSIONOS_AI_UPSTREAM_BASE_URL: https://openrouter.ai/api/v1
      OSIONOS_AI_UPSTREAM_API_KEY: ${OSIONOS_AI_PUBLIC_UPSTREAM_API_KEY:?set OSIONOS_AI_PUBLIC_UPSTREAM_API_KEY in .env.public (OpenRouter, free models only)}
      OSIONOS_AI_PLATFORM_MODELS: ${OSIONOS_AI_PUBLIC_PLATFORM_MODELS:?set OSIONOS_AI_PUBLIC_PLATFORM_MODELS in .env.public (zero-price entries only)}
      OSIONOS_AI_KEK: ${OSIONOS_AI_PUBLIC_KEK:?set OSIONOS_AI_PUBLIC_KEK in .env.public (32 random bytes, base64)}
      OSIONOS_AI_USER_DAILY_MICROUSD: ${OSIONOS_AI_PUBLIC_USER_DAILY_MICROUSD:?set in .env.public}
      OSIONOS_AI_PLATFORM_DAILY_MICROUSD: ${OSIONOS_AI_PUBLIC_PLATFORM_DAILY_MICROUSD:?set in .env.public}
    depends_on: !override
      osionos-ai-redis:
        condition: service_healthy
      osionos-ai-embed:
        condition: service_started
    mem_limit: 512m

  osionos-ai-indexer:
    image: track-binocle/osionos-ai:public
    environment:
      OSIONOS_AI_DATABASE_URL: ${OSIONOS_AI_PUBLIC_DATABASE_URL:?set OSIONOS_AI_PUBLIC_DATABASE_URL in .env.public (the live grobase DB, role osionos_ai)}
    networks: !override
      - default
      - mini-baas
    depends_on: !override
      osionos-ai-embed-bulk:
        condition: service_healthy
    mem_limit: 512m

  osionos-ai-redis:
    mem_limit: 128m

  # The nightly recommender training, on the live database as role osml_job.
  osionos-ml-job:
    image: track-binocle/osionos-ml:public
    environment:
      DATABASE_URL: ${OSML_PUBLIC_DATABASE_URL:?set OSML_PUBLIC_DATABASE_URL in .env.public (the live grobase DB, role osml_job)}
      PGPASSWORD: ""
    depends_on: !reset {}
    mem_limit: 1g

  # Caveat: the caps are sized for the host's headroom, not measured under load
  # (R-C6 asks for docker stats after startup). The bulk embedder gets fewer CPUs
  # than the dev 5 so a backfill cannot starve the live app.
  osionos-ai-embed:
    mem_limit: 1536m

  osionos-ai-embed-bulk:
    mem_limit: 1536m
    cpus: 2

  # Not started on public: voice is off, the model is OpenRouter, the db is the live one.
  osionos-ai-db:
    profiles: !override ["ai-dev-only"]
  osionos-ai-llm:
    profiles: !override ["ai-dev-only"]
  osionos-ai-stt:
    profiles: !override ["ai-dev-only"]
  # Not started on public: the web tools are forced off above.
  osionos-ai-searxng:
    profiles: !override ["ai-dev-only"]
  # Started only by --profile ai-vlm, which the public stack never passes.
  osionos-ai-vlm:
    profiles: !override ["ai-vlm"]
  # Not started on public: moderation stays at the bridge's L0 + log, sentiment is off until its licence check (devil C147, C149).
  osionos-ai-tox:
    profiles: !override ["ai-classify"]
  osionos-ai-sentiment:
    profiles: !override ["ai-classify"]
  osionos-ai-jobs:
    profiles: !override ["ai-classify"]

  # Static previews for the apps node (second Funnel node). Prod target = nginx serving dist/, built
  # with every bridge/BaaS URL empty so the apps make no request outside their own origin. They
  # sit on a network shared with local-https-proxy alone: no mini-baas, no grobase-link, no
  # env_file, no volume, a read-only root. The :public tag never overwrites a :local image.
  mail-web:
    image: track-binocle/osionos-mail-web:public
    build:
      context: ./apps/mail
      target: prod
      args:
        VITE_MAIL_BRIDGE_URL: ""
    <<: *static-preview

  calendar-web:
    image: track-binocle/osionos-calendar-web:public
    build:
      context: ./apps/calendar
      target: prod
      args:
        VITE_CALENDAR_BRIDGE_URL: ""
        VITE_CALENDAR_BAAS_URL: ""
    <<: *static-preview

  # The track-binocle.d files are mounted one by one, not as a directory: the nginx image's
  # envsubst step renders the apps vhosts into that directory at start, which a read-only
  # directory mount would refuse. The vhosts listen on LITERAL 127.0.0.1 (not
  # TRACK_BINOCLE_BIND_ADDR, which resolves to 0.0.0.0 on this host): only the Funnel reaches them.
  local-https-proxy:
    environment:
      NGINX_ENVSUBST_FILTER: PUBLIC_
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx/track-binocle.d
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN}
      PUBLIC_MAIL_ORIGIN: ${PUBLIC_MAIL_ORIGIN:-}
      PUBLIC_CALENDAR_ORIGIN: ${PUBLIC_CALENDAR_ORIGIN:-}
    ports:
      - "127.0.0.1:3102:3102"
      - "127.0.0.1:3103:3103"
    networks:
      - apps-static-net
    volumes:
      - ./infrastructure/tls/public.d/bridge-public.conf:/etc/nginx/track-binocle.d/bridge-public.conf:ro
      - ./infrastructure/tls/public.d/http-limits.conf:/etc/nginx/track-binocle.d/http-limits.conf:ro
      - ./infrastructure/tls/public.d/ai-public.conf:/etc/nginx/track-binocle.d/ai-public.conf:ro
      - ./infrastructure/tls/public.d/apps.conf.template:/etc/nginx/templates/http-apps.conf.template:ro
      - ./infrastructure/tls/public.d/http-locked-ai-cors.conf.template:/etc/nginx/templates/http-locked-ai-cors.conf.template:ro

networks:
  apps-static-net:
    internal: true
